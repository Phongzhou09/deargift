<!-- Heart Particle Animation (from Wink196/Tym-TQ) -->
<script>
(function() {
    var heartSettings = {
        particles: {
            length:   500,
            duration:   2,
            velocity: 100,
            effect: -0.75,
            size:      30,
        },
    };

    var HeartPoint = (function() {
        function HeartPoint(x, y) {
            this.x = (typeof x !== 'undefined') ? x : 0;
            this.y = (typeof y !== 'undefined') ? y : 0;
        }
        HeartPoint.prototype.clone = function() { return new HeartPoint(this.x, this.y); };
        HeartPoint.prototype.length = function(length) {
            if (typeof length == 'undefined') return Math.sqrt(this.x * this.x + this.y * this.y);
            this.normalize(); this.x *= length; this.y *= length; return this;
        };
        HeartPoint.prototype.normalize = function() {
            var l = this.length(); this.x /= l; this.y /= l; return this;
        };
        return HeartPoint;
    })();

    var HeartParticle = (function() {
        function HeartParticle() {
            this.position = new HeartPoint();
            this.velocity = new HeartPoint();
            this.acceleration = new HeartPoint();
            this.age = 0;
        }
        HeartParticle.prototype.initialize = function(x, y, dx, dy) {
            this.position.x = x; this.position.y = y;
            this.velocity.x = dx; this.velocity.y = dy;
            this.acceleration.x = dx * heartSettings.particles.effect;
            this.acceleration.y = dy * heartSettings.particles.effect;
            this.age = 0;
        };
        HeartParticle.prototype.update = function(dt) {
            this.position.x += this.velocity.x * dt;
            this.position.y += this.velocity.y * dt;
            this.velocity.x += this.acceleration.x * dt;
            this.velocity.y += this.acceleration.y * dt;
            this.age += dt;
        };
        HeartParticle.prototype.draw = function(ctx, img) {
            function ease(t) { return (--t) * t * t + 1; }
            var size = img.width * ease(this.age / heartSettings.particles.duration);
            ctx.globalAlpha = 1 - this.age / heartSettings.particles.duration;
            ctx.drawImage(img, this.position.x - size/2, this.position.y - size/2, size, size);
        };
        return HeartParticle;
    })();

    var HeartParticlePool = (function() {
        var particles, firstActive = 0, firstFree = 0,
            duration = heartSettings.particles.duration;
        function HeartParticlePool(length) {
            particles = new Array(length);
            for (var i = 0; i < particles.length; i++) particles[i] = new HeartParticle();
        }
        HeartParticlePool.prototype.add = function(x, y, dx, dy) {
            particles[firstFree].initialize(x, y, dx, dy);
            firstFree++;
            if (firstFree == particles.length) firstFree = 0;
            if (firstActive == firstFree) firstActive++;
            if (firstActive == particles.length) firstActive = 0;
        };
        HeartParticlePool.prototype.update = function(dt) {
            var i;
            if (firstActive < firstFree) for (i = firstActive; i < firstFree; i++) particles[i].update(dt);
            if (firstFree < firstActive) {
                for (i = firstActive; i < particles.length; i++) particles[i].update(dt);
                for (i = 0; i < firstFree; i++) particles[i].update(dt);
            }
            while (particles[firstActive].age >= duration && firstActive != firstFree) {
                firstActive++;
                if (firstActive == particles.length) firstActive = 0;
            }
        };
        HeartParticlePool.prototype.draw = function(ctx, img) {
            var i;
            if (firstActive < firstFree) for (i = firstActive; i < firstFree; i++) particles[i].draw(ctx, img);
            if (firstFree < firstActive) {
                for (i = firstActive; i < particles.length; i++) particles[i].draw(ctx, img);
                for (i = 0; i < firstFree; i++) particles[i].draw(ctx, img);
            }
        };
        return HeartParticlePool;
    })();

    // Expose globally so case 'gift' in ui.js can call it
    window.startHeartAnimation = function(letterText) {
        var canvas = document.getElementById('pinkboard');
        if (!canvas) return;
        canvas.style.display = 'block';
        var ctx = canvas.getContext('2d');
        var pool = new HeartParticlePool(heartSettings.particles.length);
        var particleRate = heartSettings.particles.length / heartSettings.particles.duration;
        var time;

        function pointOnHeart(t) {
            return new HeartPoint(
                160 * Math.pow(Math.sin(t), 3),
                130 * Math.cos(t) - 50 * Math.cos(2*t) - 20 * Math.cos(3*t) - 10 * Math.cos(4*t) + 25
            );
        }

        var img = (function() {
            var c = document.createElement('canvas'), x = c.getContext('2d');
            c.width = heartSettings.particles.size;
            c.height = heartSettings.particles.size;
            function to(t) {
                var p = pointOnHeart(t);
                p.x = heartSettings.particles.size/2 + p.x * heartSettings.particles.size/350;
                p.y = heartSettings.particles.size/2 - p.y * heartSettings.particles.size/350;
                return p;
            }
            x.beginPath();
            var t = -Math.PI, p = to(t);
            x.moveTo(p.x, p.y);
            while (t < Math.PI) { t += 0.01; p = to(t); x.lineTo(p.x, p.y); }
            x.closePath();
            x.fillStyle = '#ea80b0';
            x.fill();
            var image = new Image();
            image.src = c.toDataURL();
            return image;
        })();

        function onResize() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', onResize);
        onResize();

        function render() {
            requestAnimationFrame(render);
            var newTime = new Date().getTime() / 1000,
                deltaTime = newTime - (time || newTime);
            time = newTime;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            var amount = particleRate * deltaTime;
            for (var i = 0; i < amount; i++) {
                var pos = pointOnHeart(Math.PI - 2 * Math.PI * Math.random());
                var dir = pos.clone().length(heartSettings.particles.velocity);
                pool.add(canvas.width/2 + pos.x, canvas.height/2 - pos.y, dir.x, -dir.y);
            }
            pool.update(deltaTime);
            pool.draw(ctx, img);
        }
        render();

        // Show letter text in center after short delay
        var overlay = document.getElementById('heart-letter-overlay');
        if (overlay && letterText) {
            // Limit text to avoid overflow
            var displayText = letterText.length > 220 ? letterText.substring(0, 220) + '...' : letterText;
            // Add heart emoji decorators like image 2
            overlay.textContent = '❤ ' + displayText + ' ❤';
            overlay.style.whiteSpace = 'pre-line';
            // Auto adjust font size based on length
            if (letterText.length > 150) overlay.style.fontSize = '15px';
            else if (letterText.length > 80) overlay.style.fontSize = '19px';
            else overlay.style.fontSize = '26px';
            overlay.style.display = 'block';
            setTimeout(function() { overlay.style.opacity = '1'; }, 1500);
        }
    };
})();
</script>
