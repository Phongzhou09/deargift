body.tpl-body-confession {
    background: radial-gradient(circle at 50% 20%, #ffd6e2, #ff8fab 40%, #6e1233 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
}
.cf-wrap {
    --accent: #ff3b6b;
    width: min(640px, 94vw);
    text-align: center;
    position: relative;
    padding: 20px 10px;
}

/* Cute Vector Character Container */
.cute-character-wrapper {
    width: 210px;
    height: 210px;
    margin: 0 auto 10px;
    position: relative;
    cursor: pointer;
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.cute-character-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
}

/* Tail Animation */
.cat-tail {
    transform-origin: 145px 150px;
    animation: tailWag 3s infinite ease-in-out;
}
@keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(18deg); }
}

/* Face State Switching */
.face-state {
    display: none;
    opacity: 0;
    transition: opacity 0.3s ease;
}
.face-state.active {
    display: block;
    opacity: 1;
}

/* STATE 1: LOVE / NORMAL ANIMATIONS */
.char-mode-love {
    animation: floatBounce 3s infinite ease-in-out;
}
@keyframes floatBounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-12px) rotate(1.5deg); }
}
.pulsing-heart {
    animation: heartPulse 1.2s infinite ease-in-out;
    transform-origin: center center;
}
@keyframes heartPulse {
    0%, 100% { transform: translate(100px, 130px) scale(1); }
    50% { transform: translate(100px, 130px) scale(1.22); }
}

/* STATE 2: CRYING ANIMATIONS */
.char-mode-crying {
    animation: cryingShake 0.4s infinite ease-in-out;
}
@keyframes cryingShake {
    0%, 100% { transform: translateX(0) translateY(0); }
    25% { transform: translateX(-4px) translateY(2px) rotate(-2deg); }
    75% { transform: translateX(4px) translateY(-2px) rotate(2deg); }
}
.tear-left, .tear-right {
    animation: tearDrop 1s infinite linear;
}
.tear-right { animation-delay: 0.5s; }
@keyframes tearDrop {
    0% { transform: translateY(0) scaleY(0.5); opacity: 0; }
    30% { opacity: 0.9; }
    100% { transform: translateY(35px) scaleY(1.3); opacity: 0; }
}

/* STATE 3: HAPPY / CELEBRATE ANIMATIONS */
.char-mode-happy {
    animation: happyJump 0.6s infinite ease-in-out alternate;
}
@keyframes happyJump {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(-26px) scale(1.08); }
}

/* Question & Text Styling */
.cf-q {
    font-size: clamp(1.6rem, 5.8vw, 2.5rem);
    font-weight: 900;
    margin: 14px 0 6px;
    color: #fff;
    text-shadow: 0 6px 24px rgba(0,0,0,.35);
}
.cf-sub {

    margin-bottom: 26px;
    font-size: 1rem;
    font-weight: 600;
}

.cf-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 70px;
    position: relative;
}
.cf-btn {
    padding: 14px 34px;
    border: 0;
    border-radius: 999px;
    font: inherit;
    font-weight: 800;
    font-size: 1.1rem;
    cursor: pointer;
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
}
.cf-yes {
    background: #ffffff;
    color: var(--accent);
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}
.cf-yes:hover {
    transform: scale(1.12);
    box-shadow: 0 15px 35px rgba(255, 59, 107, 0.4);
}
.cf-no {
    background: rgba(255,255,255,.22);
    color: #fff;
    backdrop-filter: blur(8px);
    border: 1.5px solid rgba(255,255,255,.45);
}
.cf-no.is-loose {
    position: fixed;
    z-index: 20;
    transition: left .22s ease, top .22s ease;
}
.cf-tease {
    color: #fff;
    font-weight: 800;
    margin-top: 18px;
    min-height: 28px;
    opacity: 0;
    transition: opacity .3s ease;
    font-size: 1.1rem;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
}
.cf-tease.is-show {
    opacity: 1;
}

/* Success Card Modal */
.cf-success {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: grid;
    place-items: center;
    padding: 26px;
    background: radial-gradient(circle at 50% 30%, rgba(255,255,255,.2), rgba(20,4,16,.9));
    backdrop-filter: blur(8px);
    opacity: 0;
    visibility: hidden;
    transition: opacity .5s ease, visibility .5s ease;
}
.cf-success.is-show {
    opacity: 1;
    visibility: visible;
}
.cf-card {
    background: #fff;
    color: #3a2436;
    border-radius: 28px;
    padding: 32px 28px;
    width: min(480px, 92vw);
    box-shadow: 0 30px 80px rgba(0,0,0,.5);
    transform: scale(.8);
    transition: transform .55s cubic-bezier(.2,1.2,.4,1);
    max-height: 88vh;
    overflow-y: auto;
    text-align: center;
}
.cf-success.is-show .cf-card {
    transform: scale(1);
}
.cf-card h2 {
    color: var(--accent);
    font-size: 1.6rem;
    font-weight: 900;
    margin: 0 0 12px;
}
.cf-card p {
    white-space: pre-line;
    line-height: 1.75;
    margin: 0;
    font-size: 1.02rem;
    color: #4a3b47;
}
.cf-card img {
    border-radius: 20px;
    margin-top: 20px;
    aspect-ratio: 4/3;
    object-fit: cover;
    width: 100%;
}
</style>

<script>
(function () {
    var mode = "run";
    var yes = document.getElementById('cfYes');
    var no = document.getElementById('cfNo');
    var tease = document.getElementById('cfTease');
    var success = document.getElementById('cfSuccess');

    var charWrapper = document.getElementById('cuteCharacter');
    var faceLove = document.getElementById('faceLove');
    var faceCrying = document.getElementById('faceCrying');
    var faceHappy = document.getElementById('faceHappy');

    var lines = ['Suy nghĩ gì nữa 🥹', 'Bấm nhầm rồi đúng không?', 'Nút kia dễ thương hơn mà 👉', 'Thật sự muốn từ chối hả 😭😭', 'Đừng làm tớ khóc mà 😢😢', 'Nút bên kia kìa bấm lại đi! 💕'];
    var count = 0, scale = 1;

    // Switch Character Emotion (Love, Crying, Happy)
    function setEmotion(state) {
        faceLove.classList.remove('active');
        faceCrying.classList.remove('active');
        faceHappy.classList.remove('active');

        charWrapper.classList.remove('char-mode-love', 'char-mode-crying', 'char-mode-happy');

        if (state === 'crying') {
            faceCrying.classList.add('active');
            charWrapper.classList.add('char-mode-crying');
        } else if (state === 'happy') {
            faceHappy.classList.add('active');
            charWrapper.classList.add('char-mode-happy');
        } else {
            faceLove.classList.add('active');
            charWrapper.classList.add('char-mode-love');
        }
    }

    function say(text) {
        tease.textContent = text;
        tease.classList.add('is-show');
    }

    function dodge() {
        var pad = 20;
        var w = no.offsetWidth, h = no.offsetHeight;
        if (!no.classList.contains('is-loose')) {
            var r = no.getBoundingClientRect();
            no.style.left = r.left + 'px';
            no.style.top = r.top + 'px';
            no.classList.add('is-loose');
        }
        no.style.left = Math.random() * (window.innerWidth - w - pad * 2) + pad + 'px';
        no.style.top = Math.random() * (window.innerHeight - h - pad * 2) + pad + 'px';

        say(lines[count++ % lines.length]);
        setEmotion('crying'); // Switch character to Crying state!
    }

    // Hover or interaction on No button turns character into Crying state
    ['mouseenter', 'touchstart'].forEach(function (ev) {
        no.addEventListener(ev, function (e) {
            if (mode === 'run') { e.preventDefault(); dodge(); }
            else { setEmotion('crying'); }
        });
    });

    no.addEventListener('mouseleave', function () {
        if (charWrapper.classList.contains('char-mode-crying')) {
            // Keep crying for 1s then return to love
            setTimeout(function() {
                if (!charWrapper.classList.contains('char-mode-happy')) {
                    setEmotion('love');
                }
            }, 1200);
        }
    });

    if (mode === 'run') {
        no.addEventListener('click', function (e) { e.preventDefault(); dodge(); });
    } else if (mode === 'shrink') {
        no.addEventListener('click', function () {
            scale -= 0.18;
            count++;
            say(lines[count % lines.length]);
            setEmotion('crying');
            if (scale <= 0.25) { no.style.display = 'none'; say('Hết đường lui rồi nha 😌'); return; }
            no.style.transform = 'scale(' + scale + ')';
            yes.style.transform = 'scale(' + (1 + count * 0.12) + ')';
        });
    } else {
        no.addEventListener('click', function () {
            count++;
            say(lines[count % lines.length]);
            setEmotion('crying');
        });
    }

    // Clicking YES button triggers Super Happy Celebrate Emotion
    yes.addEventListener('click', function () {
        setEmotion('happy');
        success.classList.add('is-show');
        if (typeof GiftFX !== 'undefined') {
            GiftFX.confetti({ count: 160 });
            GiftFX.hearts(30);
            setTimeout(function () { GiftFX.confetti({ count: 90 }); }, 900);
        }
    });

    // Clicking character directly makes it giggle / heart flutter
    charWrapper.addEventListener('click', function() {
        if (!charWrapper.classList.contains('char-mode-happy')) {
            setEmotion('love');
            charWrapper.style.transform = 'scale(1.2) rotate(5deg)';
            setTimeout(function() { charWrapper.style.transform = ''; }, 300);
        }
    });

})();
</script>
