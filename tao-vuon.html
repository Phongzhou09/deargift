  <script id="dg-garden-bridge">
    window.__DG_CURRENT_USER__ = window.__DG_CURRENT_USER__ || null;
    (function() {
      // Sync localStorage auth state from DearGift server session
      try {
        var u = window.__DG_CURRENT_USER__;
        if (u && u.id) {
          var mapped = {
            id: u.id,
            uid: u.id,
            username: u.username || '',
            email: u.email || '',
            displayName: u.full_name || u.username || u.email || 'Khách hàng',
            fullName: u.full_name || u.username || ''
          };
          var tok = u.dlove_token || ('dg_sess_' + u.id);
          localStorage.setItem('token', tok);
          localStorage.setItem('user', JSON.stringify(mapped));
          localStorage.setItem('user_uid', String(u.id));
        } else {
          var prevTok = localStorage.getItem('token') || '';
          if (!prevTok || prevTok.indexOf('dg_sess_') === 0 || prevTok.indexOf('dg_') === 0) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            localStorage.removeItem('user_uid');
          }
        }
      } catch(e) {}

      // Wrap fetch so /api/dlove calls & apiv2 rewrites always carry same-origin cookies
      var origFetch = window.fetch;
      window.fetch = function(url, opts) {
        var u = typeof url === 'string' ? url : (url && url.url ? url.url : String(url || ''));
        if (u.indexOf('https://apiv2.deargift.online/api/v2') === 0) {
          u = window.location.origin + '/api/dlove' + u.slice('https://apiv2.deargift.online/api/v2'.length);
        }
        var nextOpts = opts ? Object.assign({}, opts) : {};
        if (u.indexOf(window.location.origin + '/api/dlove') === 0 || u.indexOf('/api/dlove') === 0) {
          nextOpts.credentials = 'same-origin';
        }
        return origFetch.call(this, u, nextOpts);
      };

      // Clear server cookie when user logs out inside React studio
      var origRemove = Storage.prototype.removeItem;
      Storage.prototype.removeItem = function(k) {
        origRemove.apply(this, arguments);
        if (this === window.localStorage && k === 'token' && window.__DG_CURRENT_USER__) {
          window.__DG_CURRENT_USER__ = null;
          try { origFetch('/logout.php', { credentials: 'same-origin' }).catch(function(){}); } catch(e) {}
        }
      };

      // Safety interceptor for any dynamically created dlove.vn/createqr links
      document.addEventListener('click', function(ev) {
        var a = ev.target && ev.target.closest ? ev.target.closest('a[href]') : null;
        if (!a) return;
        var href = a.getAttribute('href') || '';
        if (href.indexOf('https://dlove.vn/createqr') === 0) {
          ev.preventDefault();
          var targetUrl = href.replace('https://dlove.vn/createqr', '/gift-qr.html');
          if (a.target === '_blank') {
            window.open(targetUrl, '_blank', 'noopener,noreferrer');
          } else {
            window.location.href = targetUrl;
          }
        } else if (href === 'https://dlove.vn' || href === 'https://www.dlove.vn') {
          ev.preventDefault();
          window.location.href = '/';
        }
      }, true);
    })();
  </script>
