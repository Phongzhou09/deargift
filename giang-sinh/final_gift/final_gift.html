        <script>
            // Kiểm tra và gán vipGift data từ GiftChristmas
            // Phải chạy TRƯỚC khi module script chạy để override data mặc định
            (function() {
                // Nếu là demo mode nhưng có ảnh tải lên từ Gift Builder, áp dụng ngay
                const giftData = window.giftChristmasData;
                const userPhotos = (giftData && Array.isArray(giftData.photos) && giftData.photos.length > 0)
                    ? giftData.photos
                    : ((giftData && giftData.vipGift && Array.isArray(giftData.vipGift.images) && giftData.vipGift.images.length > 0)
                        ? giftData.vipGift.images
                        : []);
                if (userPhotos.length > 0) {
                    window.dataChristmasTree = window.dataChristmasTree || { template: "christmas-tree", data: {} };
                    window.dataChristmasTree.data = window.dataChristmasTree.data || {};
                    window.dataChristmasTree.data.images = userPhotos;
                }
                if (window.isDemoMode && window.dataChristmasTree && userPhotos.length === 0) {
                    return;
                }
                
                
                const giftData = window.giftChristmasData;
                if (giftData && (giftData.vipGift || giftData.photos)) {
                    const giftImages = (giftData.vipGift && Array.isArray(giftData.vipGift.images) && giftData.vipGift.images.length > 0)
                        ? giftData.vipGift.images
                        : (Array.isArray(giftData.photos) ? giftData.photos : []);
                    const giftMessages = (giftData.vipGift && Array.isArray(giftData.vipGift.content))
                        ? giftData.vipGift.content
                        : [];
                    
                    // Tạo hoặc cập nhật window.dataChristmasTree với vipGift/photos data
                    // Override data mặc định nếu có
                    window.dataChristmasTree = {
                        template: "christmas-tree",
                        data: {
                            title: "Merry Christmas",
                            type_music: "system",
                            music_id: "",
                            backgroundMusic: "",
                            messages: giftMessages,
                            images: giftImages
                        }
                    };
                    
               
                    // Setup nhạc nền nếu có
                    if (giftData.musicType && giftData.musicFile) {
                        if (giftData.musicType === 'sample') {
                            window.dataChristmasTree.data.type_music = 'system';
                            window.dataChristmasTree.data.backgroundMusic = `assets/musics/${giftData.musicFile}`;
                        } else if (giftData.musicType === 'file') {
                            window.dataChristmasTree.data.type_music = 'link';
                            window.dataChristmasTree.data.backgroundMusic = giftData.musicFile;
                        }
                    }
                    
                } else {
                    // Fallback: dùng data mặc định nếu không có vipGift
                    if (!window.dataChristmasTree) {
                        window.dataChristmasTree = {
                            "template": "christmas-tree",
                            "data": {
                                "title": "Merry Christmas",
                                "type_music": "zing",
                                "music_id": "Z6OZ67FD",
                                "backgroundMusic": "",
                                "messages": [
                                    "Giáng sinh vui vẻ",
                                    "Chúc em giáng sinh an lành",
                                    "Merry Christmas",
                                    "Noel vui vẻ",
                                    "Giáng sinh hạnh phúc",
                                    "Noel ấm áp"
                                ],
                                "images": [
                                    "assets/images/anhmau1.jfif",
                                    "assets/images/anhmau2.jfif"
                                ]
                            }
                        };
                    }
                }
                
              
            })();
        </script>
        <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';
        import { gsap } from 'gsap';

        let scene, camera, renderer, controls, composer;
        let treeGroup, star, staticStars, galaxy;
        let backgroundSnowflakes = [];
        let spaceSnowParticles; // Hạt tuyết bay trong không gian 3D
        let fallingSnowflakes3D = []; // Bông tuyết 3D rơi từ trên xuống

        let snowParticles, flakeParticles;
        let snowVelocities = [];
        let flakeParticlesArray = [];
        let flakeVelocities = [];

        let raycaster, mouse, interactionPlane;
        const clickEffects = [];

        let innerParticles;
        let risingParticlesData = [];
        let pathPoints = [];

        let currentColor = new THREE.Color(0x4A90E2); // Xanh da trời đậm
        let isGlobalFlashing = false;
        let isColorAnimationActive = false;
        let flashColor = new THREE.Color(0x4A90E2); // Xanh da trời đậm
        let waveProgress = { value: 0 };

        let isTreeDrawn = false;
        let forceReset = false;

        let shockwaveEffects = [];
        let dragPlane = new THREE.Plane();
        let dragOffset = new THREE.Vector3();
        let isDraggingText = false;
         const serverData = window.dataChristmasTree ? window.dataChristmasTree.data : null;

        // Lấy messages từ vipGift hoặc data mặc định
        const textMessages = serverData && serverData.messages ? serverData.messages : [];

        let activeTexts = [];
        let textContainer;

        let caughtTextObject = null;
        let mousePos = new THREE.Vector2();

        // Lấy images từ vipGift hoặc data mặc định hoặc giftChristmasData
        const initialPhotos = (serverData && Array.isArray(serverData.images) && serverData.images.length > 0)
            ? serverData.images
            : ((window.giftChristmasData && Array.isArray(window.giftChristmasData.photos) && window.giftChristmasData.photos.length > 0)
                ? window.giftChristmasData.photos
                : ((window.giftChristmasData && window.giftChristmasData.vipGift && Array.isArray(window.giftChristmasData.vipGift.images))
                    ? window.giftChristmasData.vipGift.images
                    : []));
        const imageUrls = [...initialPhotos];

        // Đồng bộ ảnh thời gian thực khi người dùng tải ảnh từ Gift Builder
        window.__updateChristmasPhotos = function(photos) {
            if (Array.isArray(photos) && photos.length > 0) {
                imageUrls.length = 0;
                photos.forEach(function(p) { imageUrls.push(p); });
                currentImageIndex = 0;
                if (typeof triggerSmartBurst === 'function') {
                    try { triggerSmartBurst(); } catch(e) {}
                }
            }
        };
        window.addEventListener('message', function(evt) {
            if (!evt.data) return;
            var isDG = evt.data.type === 'DG_LIVE_PREVIEW_UPDATE' || evt.data.type === 'LIVE_PREVIEW_UPDATE';
            if (!isDG) return;
            var data = evt.data.payload || evt.data.data;
            if (data && Array.isArray(data.photos) && data.photos.length > 0) {
                window.__updateChristmasPhotos(data.photos);
            }
        });

        // Giới hạn số lượng text/images để tránh lag và xuất hiện dần dần
        const MAX_ACTIVE_TEXTS = 30;
        let trailEmitCounter = 0; // Counter để throttle emitTrail
        const TRAIL_EMIT_INTERVAL = 3; // Chỉ emit trail mỗi 3 frames
        
        // Index để luân phiên ảnh và text cân bằng
        let currentImageIndex = 0;
        let currentTextIndex = 0;
        
        // Counter để luân phiên hướng rơi (0=giữa, 1=trái, 2=phải) - đảm bảo cân bằng
        let fallDirectionCounter = 0;

        // Hệ thống hạt bụi (Trail)
        let trailParticlesGeometry;
        let trailParticlesMesh;
        const maxTrailParticles = 1000;
        let trailParticleData = [];
        let trailWriteIndex = 0;

        function init() {
            textContainer = document.getElementById('text-container');
            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.FogExp2(0x000000, 0.001);

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 10, 60);
            // Camera nhìn về phía trước, bông tuyết sẽ rơi trong phạm vi này

            // Renderer
            renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: "high-performance" // Ưu tiên hiệu năng cao
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ReinhardToneMapping;
            document.body.appendChild(renderer.domElement);

            // Controls
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 15;
            controls.maxDistance = 100;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.3;
            controls.maxPolarAngle = Math.PI / 2 + 0.2;
            controls.enablePan = false; // Chặn thao tác pan (di chuyển camera) trên cả mobile và desktop



            // Group for tree elements
            treeGroup = new THREE.Group();
            treeGroup.position.set(0, -15, 0); // Canh chỉnh vị trí cây
            scene.add(treeGroup);

            createChristmasTree();
            createInnerSparkles();
            createStar();
            createStarfield();
            createGalaxy();

            // Post-processing for Glow Effect
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
            bloomPass.threshold = 0.1;
            bloomPass.strength = 0.7;
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createSnowfall();
            animateTreeDrawing();
            initTrails();

            raycaster = new THREE.Raycaster();
            raycaster.params.Points.threshold = 0.2;
            mouse = new THREE.Vector2();

            const planeGeometry = new THREE.PlaneGeometry(500, 500);
            const planeMaterial = new THREE.MeshBasicMaterial({ visible: false, side: THREE.DoubleSide });
            interactionPlane = new THREE.Mesh(planeGeometry, planeMaterial);
            interactionPlane.rotation.x = -Math.PI / 2;
            interactionPlane.position.y = -15;
            scene.add(interactionPlane);
            // Tạo items dần dần - xuất hiện đồng thời 1 ảnh và 1 text
            // Sử dụng setTimeout với delay ngẫu nhiên để xuất hiện tự nhiên hơn
            function createNextItem() {
                if (activeTexts.length < MAX_ACTIVE_TEXTS) {
                    // Tạo đồng thời 1 ảnh và 1 text
                        if (imageUrls.length > 0) {
                        createImageEffect(null, true);
                    }
                    // Delay nhỏ giữa ảnh và text để tự nhiên hơn
                    setTimeout(() => {
                        if (textMessages.length > 0 && activeTexts.length < MAX_ACTIVE_TEXTS) {
                            createTextEffect(true);
                        }
                    }, 100 + Math.random() * 200); // Delay 100-300ms giữa ảnh và text
                }
                
                // Delay ngẫu nhiên từ 1-1.5 giây để xuất hiện nhanh hơn
                const delay = 1000 + Math.random() * 500;
                setTimeout(createNextItem, delay);
            }
            
            // Bắt đầu tạo items sau 0.3 giây đầu tiên
            setTimeout(createNextItem, 300);
            window.addEventListener('mousedown', onInteractionStart, false);
            window.addEventListener('touchstart', onInteractionStart, false);
            window.addEventListener('mousemove', onMouseMove, false);
            window.addEventListener('touchmove', onMouseMove, { passive: false });
            window.addEventListener('mouseup', onTextRelease, false);
            window.addEventListener('touchend', onTextRelease, false);
            window.addEventListener('resize', onWindowResize, false);
        }
        function playPopSound() {
            const originalElement = document.getElementById('pop-sound');
            if (originalElement) {
                const sourceElement = originalElement.querySelector('source');
                if (sourceElement) {
                    const audioSrc = sourceElement.src;
                    const audio = new Audio(audioSrc);
                    audio.volume = 0.5;
                    audio.playbackRate = 0.8 + Math.random() * 0.4;
                    setTimeout(() => {
                        audio.play().catch(e => {
                        });
                    }, Math.random() * 50);
                }
            }
        }
        function initTrails() {
            const positions = new Float32Array(maxTrailParticles * 3);
            const colors = new Float32Array(maxTrailParticles * 3);
            const sizes = new Float32Array(maxTrailParticles);
            trailParticlesGeometry = new THREE.BufferGeometry();
            trailParticlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            trailParticlesGeometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            trailParticlesGeometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            for (let i = 0; i < maxTrailParticles; i++) {
                trailParticleData.push({
                    life: 0,
                    velocity: new THREE.Vector3()
                });
                positions[i * 3 + 1] = -1000;
            }

            const material = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                depthWrite: false,
                map: createDotTexture()
            });

            trailParticlesMesh = new THREE.Points(trailParticlesGeometry, material);
            scene.add(trailParticlesMesh);
        }
        function createImageEffect(targetUrl = null, isAmbient = false) {
            if (!targetUrl && imageUrls.length === 0) return;
            // KHÔNG GIỚI HẠN - items sẽ tự xóa khi rơi xuống dưới groundLevel
            if (!isAmbient) {
                playPopSound();
            }
            // -----------------------------------
            // Luân phiên ảnh để cân bằng (round-robin)
            let imgUrl;
            if (targetUrl) {
                imgUrl = targetUrl;
            } else if (imageUrls.length > 0) {
                imgUrl = imageUrls[currentImageIndex];
                currentImageIndex = (currentImageIndex + 1) % imageUrls.length; // Luân phiên
            } else {
                return; // Không có ảnh nào
            }
            const imgElement = document.createElement('img');
            imgElement.className = 'floating-image';
            imgElement.draggable = false;
            imgElement.id = 'img-' + Date.now() + Math.random();
            // Ẩn hoàn toàn cho đến khi ảnh load xong
            imgElement.style.display = 'none';
            imgElement.style.transform = 'translate(-50%, -50%) scale(0)';
            imgElement.style.opacity = '0';
            
            const startPosition = new THREE.Vector3();
            let velocity = new THREE.Vector3();
            
            if (isAmbient) {
                // Rơi từ trên cao - luân phiên đều 3 hướng: giữa, trái, phải
                const direction = fallDirectionCounter % 3; // 0=giữa, 1=trái, 2=phải
                fallDirectionCounter++; // Tăng counter cho lần sau
                let velX, velZ;
                
                if (direction === 0) {
                    // Rơi từ chính giữa (rơi thẳng xuống)
                    startPosition.x = (Math.random() - 0.5) * 30; // Phạm vi nhỏ quanh giữa: -15 đến +15
                    startPosition.z = (Math.random() - 0.5) * 20; // Phạm vi nhỏ: -10 đến +10
                    velX = (Math.random() - 0.5) * 0.01; // Vận tốc ngang rất nhỏ
                    velZ = (Math.random() - 0.5) * 0.01;
                } else if (direction === 1) {
                    // Rơi chéo từ góc trên bên trái
                    startPosition.x = -60 - Math.random() * 30; // -60 đến -90
                    startPosition.z = (Math.random() - 0.5) * 40; // Phân tán theo chiều sâu
                    velX = 0.05 + Math.random() * 0.06; // Bay sang phải - tăng tốc để chéo nhanh hơn
                    velZ = (Math.random() - 0.5) * 0.03; // Có thể bay về phía trước hoặc sau
                } else {
                    // Rơi chéo từ góc trên bên phải
                    startPosition.x = 60 + Math.random() * 30; // 60 đến 90
                    startPosition.z = (Math.random() - 0.5) * 40; // Phân tán theo chiều sâu
                    velX = -0.05 - Math.random() * 0.06; // Bay sang trái - tăng tốc để chéo nhanh hơn
                    velZ = (Math.random() - 0.5) * 0.03; // Có thể bay về phía trước hoặc sau
                }
                
                startPosition.y = 45;
                velocity.set(
                    velX,
                    -0.12 - Math.random() * 0.08, // Tốc độ rơi xuống
                    velZ
                );
            } else {
                // Bay ra từ ngôi sao
                star.getWorldPosition(startPosition);
                const angle = Math.random() * Math.PI * 2;
                const horizontalSpeed = 0.08 + Math.random() * 0.15;
                const upwardSpeed = 0.4 + Math.random() * 0.3;

            velocity.set(
                    Math.cos(angle) * horizontalSpeed,
                    upwardSpeed,
                    Math.sin(angle) * horizontalSpeed
                );
            }
            
            // Preload ảnh trước khi append vào DOM
            const preloadImg = new Image();
            preloadImg.onload = () => {
                // Ảnh đã load xong, giờ mới set src và hiển thị
                imgElement.src = imgUrl;
                textContainer.appendChild(imgElement);
                
                // Thêm event listeners sau khi append
                imgElement.addEventListener('mousedown', onTextCatch, false);
                imgElement.addEventListener('touchstart', onTextCatch, { passive: false });
                
                // Thêm vào activeTexts sau khi append

        function createDotTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, canvas.width / 2
            );
            gradient.addColorStop(0, 'rgba(135, 206, 235, 1)');
            gradient.addColorStop(1, 'rgba(135, 206, 235, 0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);
            return new THREE.CanvasTexture(canvas);
        }
        function createChristmasTree() {
            pathPoints = [];
            const height = 50; // Tăng chiều cao từ 40 lên 50
            const loops = 12;
            const radiusStep = 1.5; // Giảm bán kính cây thông (từ 2.0 xuống 1.5)
            const pathResolution = 3500;

            for (let i = 0; i <= pathResolution; i++) {
                const progress = i / pathResolution;
                const angle = progress * Math.PI * 2 * loops;
                const y = progress * height;
                const radius = (1 - progress) * radiusStep * loops;
                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;
                pathPoints.push(new THREE.Vector3(x, y, z));
            }
            const treeParticlesPoints = [];
            const particlesPerPoint = 50;
            const clusterWidth = 1.2; // Tăng độ rộng của đường kẻ xoáy (từ 0.9 lên 1.2)
            const originalPositions = [];
            const directionVectors = [];
            const colors = [];
            const deepBlueColor = new THREE.Color(0x4A90E2); // Xanh da trời đậm

            pathPoints.forEach(point => {
                for (let i = 0; i < particlesPerPoint; i++) {
                    const offsetX = (Math.random() - 0.5) * clusterWidth;
                    const offsetY = (Math.random() - 0.5) * clusterWidth;
                    const offsetZ = (Math.random() - 0.5) * clusterWidth;

                    const particlePosition = new THREE.Vector3(
                        point.x + offsetX,
                        point.y + offsetY,
                        point.z + offsetZ
                    );
                    treeParticlesPoints.push(particlePosition);
                    originalPositions.push(particlePosition.x, particlePosition.y, particlePosition.z);
                    const direction = new THREE.Vector3(offsetX, offsetY, offsetZ).normalize();
                    directionVectors.push(direction.x, direction.y, direction.z);
                    colors.push(deepBlueColor.r, deepBlueColor.g, deepBlueColor.b);
                }
            });
            const treeGeometry = new THREE.BufferGeometry().setFromPoints(treeParticlesPoints);
            treeGeometry.setAttribute('originalPosition', new THREE.Float32BufferAttribute(originalPositions, 3));
            treeGeometry.setAttribute('directionVector', new THREE.Float32BufferAttribute(directionVectors, 3));
            treeGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            const dotTexture = createDotTexture();
            const treeMaterial = new THREE.PointsMaterial({
                size: 0.2, // Tăng kích thước particles để đường nét dày hơn (từ 0.15 lên 0.2)
                map: dotTexture,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.7,
                depthWrite: false,
                vertexColors: true
            });
            if (treeGroup.children[0]) {
                treeGroup.remove(treeGroup.children[0]);
            }

            const particleTree = new THREE.Points(treeGeometry, treeMaterial);
            treeGroup.add(particleTree);
        }

            const vertices = [];
            vertices.push(0, 0, thickness);
            for (let i = 0; i < numPoints * 2; i++) {
                const radius = (i % 2 === 0) ? outerRadius : innerRadius;
                const angle = (i * Math.PI) / numPoints;
                const x = Math.sin(angle) * radius;
                const y = Math.cos(angle) * radius;
                vertices.push(x, y, 0);
            }
            vertices.push(0, 0, -thickness);
            const backCenterIndex = 11;

            const indices = [];
            for (let i = 1; i <= numPoints * 2; i++) {
                indices.push(0, i, (i === numPoints * 2) ? 1 : i + 1);
            }
            for (let i = 1; i <= numPoints * 2; i++) {
                indices.push(backCenterIndex, (i === numPoints * 2) ? 1 : i + 1, i);
            }

            geometry.setIndex(indices);
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geometry.computeVertexNormals();
            const material = new THREE.MeshStandardMaterial({
                color: 0x87ceeb,

        function createWhiteDotTexture() {
            // Tạo texture trắng đơn giản giống radial-gradient CSS
            const canvas = document.createElement('canvas');
            canvas.width = 48;
            canvas.height = 48;
            const context = canvas.getContext('2d');
            const gradient = context.createRadialGradient(
                canvas.width / 2, canvas.height / 2, 0,
                canvas.width / 2, canvas.height / 2, canvas.width / 2
            );
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
            context.fillStyle = gradient;
            context.fillRect(0, 0, canvas.width, canvas.height);
            return new THREE.CanvasTexture(canvas);
        }

        function animate() {
            requestAnimationFrame(animate);

            if (galaxy) galaxy.rotation.y += 0.0005;
            
            // Xoay các bông tuyết nền nhẹ nhàng
            if (backgroundSnowflakes && backgroundSnowflakes.length > 0) {
                backgroundSnowflakes.forEach(snowflakes => {
                    if (snowflakes.userData && snowflakes.userData.rotationSpeed) {
                        snowflakes.rotation.y += snowflakes.userData.rotationSpeed;
                    }
                });
            }
            
            // Xoay và rơi các bông tuyết thiên hà (giống Galaxy - hình xoắn ốc xoay)
            if (spaceSnowParticles && spaceSnowParticles.length > 0) {
                spaceSnowParticles.forEach(snowflakes => {
                    snowflakes.rotation.y += 0.0005; // Xoay chậm giống Galaxy
                    
                    // Rơi với tốc độ cố định và chậm (không tăng tốc)
                    const positions = snowflakes.geometry.attributes.position;
                    const velocities = snowflakes.userData.velocities;
                    const initialY = snowflakes.userData.initialY;
                    
                    for (let i = 0; i < positions.count; i++) {
                        // Cập nhật vị trí Y với tốc độ cố định (chậm)
                        const currentY = positions.getY(i);
                        positions.setY(i, currentY + velocities[i]);
                        
                        // Reset khi rơi xuống quá thấp (dưới -25)
                        if (currentY < -25) {
                            // Đặt lại vị trí Y ở trên cao (từ -15 đến +35) để rơi từ từ
                            positions.setY(i, -15 + Math.random() * 50);
                        }
                    }
                    positions.needsUpdate = true;
                });
            }
            
            // Cập nhật chấm trắng 3D rơi từ trên xuống
            if (fallingSnowflakes3D && fallingSnowflakes3D.length > 0) {
                fallingSnowflakes3D.forEach(snowflakes => {
                    const positions = snowflakes.geometry.attributes.position;
                    const userData = snowflakes.userData;
                    const velocities = userData.velocities;
                    
                    for (let i = 0; i < positions.count; i++) {
                        // Cập nhật vị trí theo vận tốc
                        positions.setX(i, positions.getX(i) + velocities[i * 3]);
                        positions.setY(i, positions.getY(i) + velocities[i * 3 + 1]);
                        positions.setZ(i, positions.getZ(i) + velocities[i * 3 + 2]);
                        
                        // Reset khi rơi xuống quá thấp (dưới -40)
                        if (positions.getY(i) < -40) {
                            // Đặt lại vị trí ở trên cao (trong phạm vi camera)
                            positions.setX(i, (Math.random() - 0.5) * 200);
                            positions.setY(i, 30 + Math.random() * 150);
                            positions.setZ(i, (Math.random() - 0.5) * 200 - 30);
                            
                            // Reset vận tốc
                            velocities[i * 3] = (Math.random() - 0.5) * 0.04;
                            velocities[i * 3 + 1] = -0.1 - Math.random() * 0.15;
                            velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.03;
                        }
                    }
                    positions.needsUpdate = true;
                });
            }
            
            if (star && star.scale.x > 0) star.rotation.y += 0.01;
            for (let i = clickEffects.length - 1; i >= 0; i--) {
                const sparkles = clickEffects[i];
                const positions = sparkles.geometry.attributes.position;
                const velocities = sparkles.userData.velocities;
                for (let j = 0; j < positions.count; j++) {
                    positions.setX(j, positions.getX(j) + velocities[j].x);
                    positions.setY(j, positions.getY(j) + velocities[j].y);
                    positions.setZ(j, positions.getZ(j) + velocities[j].z);
                }
                positions.needsUpdate = true;
                sparkles.userData.life -= sparkles.userData.decay;
                sparkles.material.opacity = Math.max(0, sparkles.userData.life);
                if (sparkles.userData.life <= 0) {
                    scene.remove(sparkles);
                    sparkles.geometry.dispose();
                    sparkles.material.dispose();
                    clickEffects.splice(i, 1);
                }
            }

            for (let i = shockwaveEffects.length - 1; i >= 0; i--) {
                const shockwave = shockwaveEffects[i];
                const positions = shockwave.geometry.attributes.position;
                const particleData = shockwave.userData.particles;
                shockwave.userData.life -= shockwave.userData.decay;
                shockwave.material.opacity = Math.max(0, shockwave.userData.life);
                for (let j = 0; j < positions.count; j++) {
                    const direction = particleData[j].direction;
                    const speed = particleData[j].speed;

                    positions.setX(j, positions.getX(j) + direction.x * speed);
                    positions.setY(j, positions.getY(j) + direction.y * speed);
                    positions.setZ(j, positions.getZ(j) + direction.z * speed);
                }
                positions.needsUpdate = true;
                if (shockwave.userData.life <= 0) {
                    treeGroup.remove(shockwave);
                    shockwave.geometry.dispose();
                    shockwave.material.dispose();
                    shockwaveEffects.splice(i, 1);
                }
            }

            if (trailParticlesMesh) {
                const positions = trailParticlesMesh.geometry.attributes.position.array;
                const colors = trailParticlesMesh.geometry.attributes.color.array;
                for (let i = 0; i < maxTrailParticles; i++) {
                    if (trailParticleData[i].life > 0) {
                        trailParticleData[i].life -= 0.02;
                        positions[i * 3] += trailParticleData[i].velocity.x;
                        positions[i * 3 + 1] += trailParticleData[i].velocity.y;
                        positions[i * 3 + 2] += trailParticleData[i].velocity.z;
                        if (trailParticleData[i].life <= 0) {
                            positions[i * 3 + 1] = -1000;
                        }
                    } else {
                        positions[i * 3 + 1] = -1000;
                    }
                }
                trailParticlesMesh.geometry.attributes.position.needsUpdate = true;
            }

            const gravity = -0.008; // Tăng gravity để rơi nhanh hơn nữa
            const groundLevel = -20;
            const fadeZone = 8;
            const nowTime = Date.now() * 0.001;

            for (let i = activeTexts.length - 1; i >= 0; i--) {
                const textObj = activeTexts[i];
                if (textObj.position.y > groundLevel) {
                    emitTrail(textObj.position);
                }
                if (textObj.isCaught) {
                    raycaster.setFromCamera(mouse, camera);
                    const intersectPoint = new THREE.Vector3();
                    raycaster.ray.intersectPlane(dragPlane, intersectPoint);
                    if (intersectPoint) {
                        textObj.position.copy(intersectPoint.add(dragOffset));
                    }
                    textObj.velocity.set(0, 0, 0);
                } else {
                    textObj.velocity.y += gravity;
                    const t = nowTime + textObj.timeOffset;
                    const swayForceX = Math.sin(t * textObj.swayFreq) * 0.002;
                    const swayForceZ = Math.cos(t * textObj.swayFreq * 0.8) * 0.002;
                    textObj.velocity.x += swayForceX;
                    textObj.velocity.z += swayForceZ;
                    textObj.velocity.multiplyScalar(0.96);
                    textObj.position.add(textObj.velocity);
                }

                // Tối ưu: dùng tempVec để tránh modify position 3D
                const tempVec = textObj.position.clone();
                tempVec.project(camera);
                let scale = 1.0;
                if (textObj.isCaught) scale = 1.2;

                if (tempVec.z < 1) {
                    const screenX = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
                    const screenY = (-tempVec.y * 0.5 + 0.5) * window.innerHeight;
                    
                    // Batch DOM updates: chỉ update khi giá trị thay đổi đáng kể để giảm reflow
                    const currentLeft = parseFloat(textObj.element.style.left) || 0;
                    const currentTop = parseFloat(textObj.element.style.top) || 0;
                    const threshold = 2; // Chỉ update nếu thay đổi > 2px
                    
                    if (Math.abs(screenX - currentLeft) > threshold || Math.abs(screenY - currentTop) > threshold || textObj.element.style.display === 'none') {
                        textObj.element.style.display = 'block';
                        textObj.element.style.left = `${screenX}px`;
                        textObj.element.style.top = `${screenY}px`;
                    }
                    
                    if (textObj.isCaught) {
                        textObj.element.style.transform = `translate(-50%, -50%) scale(${scale})`;
                    } else {
                        textObj.element.style.transform = `translate(-50%, -50%) scale(1)`;
                    }

                } else {
                    textObj.element.style.display = 'none';
                }

                if (!textObj.isCaught) {
                    if (textObj.position.y < groundLevel + fadeZone) {
                        const opacity = (textObj.position.y - groundLevel) / fadeZone;
                        textObj.element.style.opacity = Math.max(0, opacity);
                    } else {
                        textObj.element.style.opacity = 1;
                    }

                    if (textObj.position.y < groundLevel) {
                        if (textObj.element.parentNode) {
                            textObj.element.parentNode.removeChild(textObj.element);
                        }
                        activeTexts.splice(i, 1);
                    }
                } else {
                    textObj.element.style.opacity = 1;
                }
            }

            if (innerParticles && innerParticles.visible && pathPoints.length > 0) {
                const positions = innerParticles.geometry.attributes.position;
                for (let i = 0; i < risingParticlesData.length; i++) {
                    const data = risingParticlesData[i];
                    data.progress += data.speed;
                    if (data.progress >= 1) {
                        data.progress = 0.001;
                        if (i === 0) triggerStarFlash();
                    }
                    const pathIndex = Math.floor(data.progress * (pathPoints.length - 1));
                    const basePoint = pathPoints[pathIndex];
                    const currentRadius = data.radius * (1 - data.progress);
                    const offsetX = Math.cos(data.angle) * currentRadius;
                    const offsetZ = Math.sin(data.angle) * currentRadius;
                    positions.setXYZ(i, basePoint.x + offsetX, basePoint.y, basePoint.z + offsetZ);
                }
                positions.needsUpdate = true;
            }

            const particleTree = treeGroup.children[0];
            if (particleTree && particleTree.geometry.attributes.originalPosition) {
                const now = Date.now() * 0.001;
                const positions = particleTree.geometry.attributes.position;
                const originalPositions = particleTree.geometry.attributes.originalPosition;
                const directions = particleTree.geometry.attributes.directionVector;
                const colors = particleTree.geometry.attributes.color;
                const breathFactor = Math.sin(now * 0.4) * 0.1;
                for (let i = 0; i < positions.count; i++) {
                    positions.setXYZ(i,
                        originalPositions.getX(i) + directions.getX(i) * breathFactor,
                        originalPositions.getY(i) + directions.getY(i) * breathFactor,
                        originalPositions.getZ(i) + directions.getZ(i) * breathFactor
                    );
                }
                positions.needsUpdate = true;
                if (isColorAnimationActive) {
                    const waveFrontIndex = Math.floor(waveProgress.value * colors.count);
                    for (let i = 0; i < colors.count; i++) {
                        const defaultDeepBlue = new THREE.Color(0x4A90E2); // Xanh da trời đậm
                    if (waveProgress.value < 1) {
                            if (i <= waveFrontIndex) colors.setXYZ(i, flashColor.r, flashColor.g, flashColor.b);
                            else colors.setXYZ(i, defaultDeepBlue.r, defaultDeepBlue.g, defaultDeepBlue.b);
                        } else {
                            colors.setXYZ(i, flashColor.r, flashColor.g, flashColor.b);
                        }
                    }
                } else {
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(particleTree);

                    if (forceReset || intersects.length === 0) {
                        const defaultDeepBlue = new THREE.Color(0x4A90E2); // Xanh da trời đậm
                        for (let i = 0; i < colors.count; i++) {
                            colors.setXYZ(i, defaultDeepBlue.r, defaultDeepBlue.g, defaultDeepBlue.b);
                        }
                        if (star) {
                            star.material.color.setHex(0x87ceeb);
                            star.material.emissive.setHex(0x87ceeb);
                        }
                        if (intersects.length === 0) {
                            forceReset = false;
                        }
                    } else {
                        const intersectionPoint = intersects[0].point;
                        const baseHue = (now * 0.03) % 1;
                        const adjustedHue = 0.5 + baseHue * 0.15; // Tông xanh da trời (0.5-0.65)
                        currentColor.setHSL(adjustedHue, 0.8, 0.5); // Đậm hơn
                        const defaultDeepBlue = new THREE.Color(0x4A90E2); // Xanh da trời đậm

                        for (let i = 0; i < positions.count; i++) {
                            const particlePos = new THREE.Vector3().fromBufferAttribute(positions, i);
                            if (particlePos.distanceTo(intersectionPoint) < 4.0) {
                                colors.setXYZ(i, currentColor.r, currentColor.g, currentColor.b);
                            } else {
                                colors.setXYZ(i, defaultDeepBlue.r, defaultDeepBlue.g, defaultDeepBlue.b);
                            }
                        }
                    }
                }
                colors.needsUpdate = true;
            }

            controls.update();
            const centerTarget = new THREE.Vector3(0, 5, 0);
            controls.target.lerp(centerTarget, 0.02);
            composer.render();
        }
        function triggerStarFlash() {
            if (star && star.material) {
                gsap.to(star.material, {
                    emissiveIntensity: 2.5,
                    duration: 0.15,
                    yoyo: true,
                    repeat: 1
                });
            }
        }
        init();
        animate();
    </script>
