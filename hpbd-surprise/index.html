    <script>
    window.addEventListener('message', function(e) {
        if (e.origin !== window.location.origin || e.source !== window.parent) return;
        if (!e.data || (e.data.type !== 'DG_LIVE_PREVIEW_UPDATE' && e.data.type !== 'LIVE_PREVIEW_UPDATE')) return;
        var d = e.data.payload || e.data.data || {};
        if (d.sender_name) {
            var titleEl = document.querySelector('.title__letter');
            if (titleEl) titleEl.textContent = d.sender_name;
        }
        if (d.message) {
            var contentEl = document.querySelector('.content__letter');
            if (contentEl) {
                contentEl.textContent = String(d.message);
                contentEl.style.whiteSpace = 'pre-line';
            }
        }
        if (Array.isArray(d.photos) && d.photos.length > 0) {
            var imgEl = document.querySelector('.avatar_img') || document.querySelector('.box__account img');
            if (imgEl) imgEl.src = d.photos[0];
        }
        if (d.music_url) {
            var aud = document.querySelector('audio');
            if (aud && aud.src !== d.music_url) aud.src = d.music_url;
        }
    });
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'DG_PREVIEW_READY' }, window.location.origin);
    }
    </script>

    <script>
        document.addEventListener('mousemove', function(e){
            let body = document.querySelector('body');
            let heart = document.createElement('span');
            let x = e.offsetX;
            let y = e.offsetY;
            heart.style.left = x+'px';
            heart.style.top = y+'px';

            let size = Math.random() * 10;
            heart.style.width = 4 * size+'px';
            heart.style.height = 4 * size+'px';

            let transformValue = Math.random() * 360;
            heart.style.transform = 'rotate('+ transformValue +'deg)';

            body.appendChild(heart);

            setTimeout(function(){
                heart.remove();
            },1000)
        })

        let mailBox = document.querySelector('.mail');
        let boxmail = document.querySelector('.boxMail');
        var close = document.querySelector('.fa-xmark');
        var bgMusic = document.getElementById('bgMusic');
        var musicBtn = document.getElementById('musicBtn');

        function toggleMusic() {
            if (!bgMusic) return;
            if (bgMusic.paused) {
                bgMusic.play().then(() => {
                    if (musicBtn) musicBtn.classList.add('playing');
                }).catch(err => console.log('Audio error:', err));
            } else {
                bgMusic.pause();
                if (musicBtn) musicBtn.classList.remove('playing');
            }
        }

        if (musicBtn) {
            musicBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                toggleMusic();
            });
        }

        mailBox.onclick = function(){
            mailBox.classList.toggle('active');
            boxmail.classList.add('active');
            if (bgMusic && bgMusic.paused) {
                bgMusic.play().then(() => {
                    if (musicBtn) musicBtn.classList.add('playing');
                }).catch(err => console.log('Audio error:', err));
            }
        };

        close.addEventListener('click', function(){
            boxmail.classList.remove('active');
        });
    </script>
