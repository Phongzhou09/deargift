<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lịch Sử Giao Dịch · DearGift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css?v=1794032998">
  <link rel="stylesheet" href="css/pastel-theme.css?v=1790426802">
  <link rel="stylesheet" href="css/dashboard-shell.css?v=1795670000">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="user-app">

  <header class="workspace-topnav"></header>

  <main class="main-content">
    <div class="top-header">
      <div>
        <h1>Lịch Sử Giao Dịch</h1>
        <p>Theo dõi mọi khoản thanh toán đã ghi nhận trong hệ thống cho các món quà của bạn.</p>
      </div>
      <div></div>
    </div>

    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon-wrapper" style="background:#d1fae5;color:#059669;"><i data-lucide="receipt"></i></div>
        <div>
          <div style="font-size:24px;font-weight:800;color:#1b171c;" id="tx-count">0</div>
          <div style="font-size:12.5px;color:#756d77;font-weight:600;">Giao dịch thành công</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper" style="background:#ffe4e6;color:#e8589a;"><i data-lucide="wallet"></i></div>
        <div>
          <div style="font-size:24px;font-weight:800;color:#1b171c;" id="tx-total">0đ</div>
          <div style="font-size:12.5px;color:#756d77;font-weight:600;">Tổng chi tiêu</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon-wrapper" style="background:#f3e8ff;color:#7c3aed;"><i data-lucide="shield-check"></i></div>
        <div>
          <div style="font-size:16px;font-weight:800;color:#1b171c;" id="tx-latest">—</div>
          <div style="font-size:12.5px;color:#756d77;font-weight:600;">Giao dịch gần nhất</div>
        </div>
      </div>
    </section>

    <section class="filter-bar" style="flex-wrap:wrap;justify-content:space-between;">
      <div style="display:flex;align-items:center;gap:10px;flex:1;max-width:380px;min-width:220px;">
        <i data-lucide="search" style="width:16px;height:16px;color:#8b828d;flex-shrink:0;"></i>
        <input type="text" id="tx-search" class="search-input" placeholder="Tìm mã tham chiếu, mã quà, người nhận..." oninput="renderTx()">
      </div>
      <button type="button" onclick="exportCsv()" class="btn btn-primary" style="padding:8px 16px;border-radius:12px;border:none;color:#fff;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;">
        <i data-lucide="download" style="width:15px;height:15px;"></i> Xuất CSV
      </button>
    </section>

    <section class="recent-gifts-card">
      <div class="gifts-table-wrapper">
        <table class="gifts-table">
          <thead>
            <tr>
              <th>Mã GD</th>
              <th>Mã Quà</th>
              <th>Người Nhận</th>
              <th>Số Tiền</th>
              <th>Kênh Thanh Toán</th>
              <th>Nội Dung CK</th>
              <th>Thời Gian</th>
              <th style="text-align:right;">Mở Quà</th>
            </tr>
          </thead>
          <tbody id="tx-tbody">
            <tr><td colspan="8" style="text-align:center;color:#756d77;padding:32px;">Đang tải lịch sử giao dịch...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div class="bottom-nav"></div>

  <script src="js/dashboard-workspace.js"></script>
  <script>
    var allTx = [];

    function gatewayLabel(gw) {
      var g = String(gw || '').toLowerCase();
      if (g === 'casso') return '<span class="badge success">Casso Auto</span>';
      if (g === 'webhook' || g === 'bank_get') return '<span class="badge success">Webhook Bank</span>';
      if (g === 'vietqr') return '<span class="badge primary">VietQR</span>';
      return '<span class="badge secondary">Xác nhận</span>';
    }

    function loadTx() {
      fetch('/api/my-transactions')
        .then(function (r) { return r.json(); })
        .then(function (res) {
          allTx = (res && res.transactions) ? res.transactions : [];
          updateTxStats();
          renderTx();
        })
        .catch(function () {
          allTx = [];
          updateTxStats();
          renderTx();
        });
    }

    function updateTxStats() {
      var totalAmt = allTx.reduce(function (s, t) { return s + Number(t.amount || 0); }, 0);
      document.getElementById('tx-count').textContent = allTx.length;
      document.getElementById('tx-total').textContent = totalAmt.toLocaleString('vi-VN') + 'đ';
      document.getElementById('tx-latest').textContent = allTx.length ? DG.formatDate(allTx[0].created_at) : 'Chưa có';
    }

    function getFilteredTx() {
      var q = (document.getElementById('tx-search').value || '').trim().toLowerCase();
      return allTx.filter(function (t) {
        if (!q) return true;
        var hay = [t.id, t.share_code, t.transaction_ref, t.recipient_name, t.gateway, t.transfer_content].join(' ').toLowerCase();
        return hay.indexOf(q) !== -1;
      });
    }

    function renderTx() {
      var rows = getFilteredTx();
      var tbody = document.getElementById('tx-tbody');
      if (!rows.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;color:#756d77;padding:36px;">Chưa có giao dịch nào được ghi nhận.</td></tr>';
        return;
      }

      tbody.innerHTML = rows.map(function (t) {
        var viewUrl = '/gift.php?uid=' + encodeURIComponent(t.gift_id);
        return (
          '<tr>' +
            '<td style="font-family:monospace;font-weight:700;">#TX' + DG.escapeHtml(t.id) + '</td>' +
            '<td style="font-family:monospace;font-weight:800;color:#d51e68;">#' + DG.escapeHtml(t.share_code) + '</td>' +
            '<td style="font-weight:700;">' + DG.escapeHtml(t.recipient_name || 'Người thương') + '</td>' +
            '<td style="font-weight:700;color:#059669;">' + DG.escapeHtml(DG.formatVnd(t.amount)) + '</td>' +
            '<td>' + gatewayLabel(t.gateway) + '</td>' +
            '<td style="font-family:monospace;font-size:12px;color:#5c5266;">' + DG.escapeHtml(t.transfer_content || ('DEAR ' + t.share_code)) + '</td>' +
            '<td style="color:#756d77;font-size:12px;">' + DG.escapeHtml(DG.formatDate(t.created_at)) + '</td>' +
            '<td style="text-align:right;"><a href="' + DG.escapeHtml(viewUrl) + '" target="_blank" style="padding:6px 12px;border-radius:10px;border:1px solid #e9e5eb;font-size:12px;font-weight:700;color:#3d3551;text-decoration:none;">Xem quà</a></td>' +
          '</tr>'
        );
      }).join('');
    }

    function exportCsv() {
      var rows = getFilteredTx();
      if (!rows.length) {
        DG.toast('Không có giao dịch để xuất.', true);
        return;
      }
      var header = ['ID', 'MaQua', 'NguoiNhan', 'SoTien', 'Kenh', 'NoiDungCK', 'ThoiGian'];
      var csvLines = [header.join(',')].concat(rows.map(function (t) {
        return [
          t.id,
          '"' + String(t.share_code || '').replace(/"/g, '""') + '"',
          '"' + String(t.recipient_name || '').replace(/"/g, '""') + '"',
          Number(t.amount || 0),
          '"' + String(t.gateway || '').replace(/"/g, '""') + '"',
          '"' + String(t.transfer_content || '').replace(/"/g, '""') + '"',
          '"' + String(t.created_at || '').replace(/"/g, '""') + '"',
        ].join(',');
      }));
      var blob = new Blob(['\uFEFF' + csvLines.join('\n')], { type: 'text/csv;charset=utf-8;' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'deargift-transactions.csv';
      a.click();
      DG.toast('✓ Đã xuất file CSV giao dịch!');
    }

    DG.boot('transactions', loadTx);
  </script>
</body>
</html>
