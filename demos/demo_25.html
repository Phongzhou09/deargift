        <script>
    window.addEventListener('message', function(e) {
        if (e.origin !== window.location.origin || e.source !== window.parent) return;
        if (!e.data || (e.data.type !== 'DG_LIVE_PREVIEW_UPDATE' && e.data.type !== 'LIVE_PREVIEW_UPDATE')) return;
        var d = e.data.payload || e.data.data || {};
        if (d.recipient_name) {
            var nameEl = document.querySelector('.box__account .name span');
            if (nameEl) nameEl.textContent = d.recipient_name;
        }
        if (d.morph_text_1) {
            var dateEl = document.querySelector('.date__of__birth span');
            if (dateEl) dateEl.textContent = d.morph_text_1;
        }
        if (d.sender_name) {
            var titleEl = document.querySelector('.title__letter') || document.querySelector('.title h2');
            if (titleEl) titleEl.textContent = d.sender_name;
        }
        if (d.message) {
            var contentEl = document.querySelector('.content__letter') || document.querySelector('.letter__content');
            if (contentEl) {
                contentEl.textContent = String(d.message);
                contentEl.style.whiteSpace = 'pre-line';
            }
        }
        if (Array.isArray(d.photos) && d.photos.length > 0) {
            var imgEl = document.querySelector('.box__account .image img');
            if (imgEl) imgEl.src = d.photos[0];
        }
        if (d.music_url) {
            var aud = document.querySelector('audio');
            if (aud && aud.src !== d.music_url) aud.src = d.music_url;
        }
    });
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'DG_PREVIEW_READY' }, window.location.origin);
    }
    </script>

<script>
    let datetxt = "1\/1\/2003";
    let datatxtletter = "Ch\u1ea1m \u0111\u1ec3 kh\u00e1m ph\u00e1 hi\u1ec7u \u1ee9ng c\u1ee7a m\u1eabu qu\u00e0 n\u00e0y.";
    let titleLetter = "DearGift";
    let charArrDate = datetxt.split('');
    let charArrDateLetter = datatxtletter.split('');
    let charArrTitle = titleLetter.split('');
    let currentIndex = 0;
    let currentIndexLetter = 0;
    let currentIndexTitle = 0;
    let date__of__birth = document.querySelector(".date__of__birth span");
    let text__letter = document.querySelector(".text__letter p");
    setTimeout(function(){
        timeDatetxt = setInterval(function(){
            if(currentIndex < charArrDate.length){
                date__of__birth.textContent += charArrDate[currentIndex];
                currentIndex++;
            }
            else{
                let i = document.createElement("i");
                i.className = "fa-solid fa-star"
                document.querySelector(".date__of__birth").prepend(i)
                document.querySelector(".date__of__birth").appendChild(i.cloneNode(true))
                clearInterval(timeDatetxt)
            }
        },100)
    },12000)

    var intervalContent;
    var intervalTitle;
    var bgMusic = document.getElementById('bgMusic');
    var musicBtn = document.getElementById('musicBtn');

    function toggleLetterMusic() {
        if (!bgMusic) return;
        if (bgMusic.paused) {
            bgMusic.play().then(() => {
                if (musicBtn) musicBtn.classList.add('playing');
            }).catch(e => console.log('Audio playback prevented:', e));
        } else {
            bgMusic.pause();
            if (musicBtn) musicBtn.classList.remove('playing');
        }
    }

    if (musicBtn) {
        musicBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            toggleLetterMusic();
        });
    }

    $("#btn__letter").on("click", function(){
        if (bgMusic && bgMusic.paused) {
            bgMusic.play().then(() => {
                if (musicBtn) musicBtn.classList.add('playing');
            }).catch(e => console.log('Audio playback error:', e));
        }
        $(".box__letter").slideDown()
        setTimeout(function(){
            $(".letter__border").slideDown();
        },1000)
        setTimeout(function(){
            intervalTitle = setInterval(function(){
                if(currentIndexTitle < charArrTitle.length){
                    document.querySelector(".title__letter").textContent += charArrTitle[currentIndexTitle];
                    let i = document.createElement("i");
                    i.className = "fa-solid fa-heart"
                    document.querySelector(".title__letter").appendChild(i)
                    currentIndexTitle++;
                }
                else{
                    clearInterval(intervalTitle)
                }
            },100)
        },2000)
        setTimeout(function(){
            document.querySelector("#heart__letter").classList.add("animationOp");
            document.querySelector(".love__img").classList.add("animationOp");
            document.querySelector("#mewmew").classList.add("animationOp");
        },2800)
        setTimeout(function(){
            document.querySelectorAll(".heart").forEach((item)=>{
                item.classList.add("animation")
            })
        },3500)
        setTimeout(function(){
            intervalContent = setInterval(function(){
                if(currentIndexLetter < charArrDateLetter.length){
                    text__letter.textContent += charArrDateLetter[currentIndexLetter];
                    currentIndexLetter++;
                }
                else{
                    clearInterval(intervalContent)
                }
            },50)
        },6000)
    })
    $(".close").on("click", function(){
        clearInterval(intervalContent)
        document.querySelector(".title__letter").textContent = "";
        text__letter.textContent = "";
        currentIndexLetter = 0
        currentIndexTitle = 0
        document.querySelector("#heart__letter").classList.remove("animationOp");
        document.querySelector(".love__img").classList.remove("animationOp");
        document.querySelector("#mewmew").classList.remove("animationOp");
        document.querySelectorAll(".heart").forEach((item)=>{
                item.classList.remove("animation")
            })
        $(".box__letter").slideUp();
        $(".letter__border").slideUp();
    })


    //mobile

    function mobile(){
        const app = {
            timeout: function(txt, dom){
                let currentIndex = 0;
                let charArr = txt.split('')
                intervalMobile = setInterval(function(){
                    if(currentIndex < charArr.length){
                        dom.textContent += charArr[currentIndex];
                        currentIndex++;
                    }
                    else{
                        clearInterval(intervalMobile)
                    }
                },200)
            }
        }
        return app
    }
    const fcMobile = mobile()
    if(window.innerWidth < 768){
        setTimeout(()=>{
            fcMobile.timeout("26", document.querySelector(".day"))
        },5000)
        setTimeout(()=>{
            fcMobile.timeout("10", document.querySelector(".month"))
        },6000)
    }
    
</script>
