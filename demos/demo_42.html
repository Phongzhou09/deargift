<script>
window.__GIFTTO_APP = window.__GIFTTO_APP || {
    "cake": {
        "senderName": "DearGift",
        "receiverName": "Người thương",
        "day": 19,
        "month": 11,
        "letterBody": "Chúc bạn tuổi mới luôn rực rỡ, bình an và tràn ngập niềm vui!",
        "wishOptions": ["Hạnh phúc hơn", "Trúng Vietlott", "Khỏe mạnh hơn", "Bình yên hơn"]
    }
};

// Lắng nghe cập nhật từ Gift Builder Live Preview
window.addEventListener('message', function(event) {
    if (!event.data || (event.data.type !== 'DG_LIVE_PREVIEW_UPDATE' && event.data.type !== 'LIVE_PREVIEW_UPDATE')) return;
    var p = event.data.payload || event.data.data || {};
    var day = parseInt(p.birthday_day || p.v3_calendar_day || 19, 10);
    var month = parseInt(p.birthday_month || p.v3_calendar_month || 11, 10);
    var senderName = (p.sender_name || '').trim();
    var receiverName = (p.recipient_name || '').trim();
    var letterBody = (p.message || p.letter_content || '').trim();
    var photos = p.photos || [];

    if (!window.__GIFTTO_APP) window.__GIFTTO_APP = {};
    if (!window.__GIFTTO_APP.cake) window.__GIFTTO_APP.cake = {};

    var c = window.__GIFTTO_APP.cake;
    var dateChanged = (c.day !== day || c.month !== month);
    c.day = day;
    c.month = month;
    if (senderName) c.senderName = senderName;
    if (receiverName) c.receiverName = receiverName;
    if (letterBody) c.letterBody = letterBody;
    if (photos && photos.length) c.photos = photos;

    var iframe = document.querySelector('.gift-app-frame');
    if (iframe && dateChanged) {
        var base = iframe.src.split('&_t=')[0];
        iframe.src = base + '&_t=' + Date.now();
    }
});

// Báo hiệu iframe demo sẵn sàng nhận dữ liệu
try {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'DG_PREVIEW_READY' }, '*');
    }
} catch(e) {}
</script>
