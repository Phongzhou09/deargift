    <div class="start-overlay" id="start-overlay">
        <h2 style="color: #ff6b81; font-family: 'Muli', sans-serif; margin-bottom: 20px;">Chuyến xe tình yêu đã tới 🚌</h2>
        <button class="start-btn" id="start-btn">Bắt đầu ngay</button>
    </div>

    <!-- Hot Air Balloon -->
    <div class="balloon-container" id="balloon-container">
        <div class="hot-air-balloon"></div>
        <div class="basket">
            <div class="envelope-icon">💌</div>
        </div>
        <div class="click-me-text">Nhấn vào đây!</div>
    </div>

    <!-- Letter Modal -->
    <div class="letter-modal" id="letter-modal">
        <div class="letter-content">
            <span class="letter-close" id="close-letter-btn">&times;</span>
            <h2 id="popup-title" style="color: #ff6b81; font-family: 'Muli', sans-serif; text-align: center; margin-bottom: 20px;">Gửi cho em 💖</h2>
            <div id="popup-message" class="letter-text">Chuyến xe này chở theo cả bầu trời thương nhớ, chỉ để dừng lại trước cửa nhà em. 🥰</div>
        </div>
    </div>

    <script>
        // Nhận dữ liệu đang nhập từ trang dựng quà để demo và quà đã tạo
        // dùng cùng một cấu trúc nội dung.
        window.addEventListener('message', function (event) {
            if (event.origin !== window.location.origin || event.source !== window.parent) return;
            var data = event.data && event.data.type === 'DG_LIVE_PREVIEW_UPDATE' ? event.data.payload : null;
            if (!data) return;
            if (data.message !== undefined) document.getElementById('bus-message').textContent = data.message || 'I LOVE YOU';
            if (data.popup_title !== undefined) document.getElementById('popup-title').textContent = data.popup_title || 'Gửi cho ấy 💖';
            if (data.popup_message !== undefined) document.getElementById('popup-message').textContent = data.popup_message || 'Có một điều rất đặc biệt mình muốn nói với ấy... 🥰';
            if (data.music_url) {
                var liveMusic = document.getElementById('bgMusic');
                if (!liveMusic) {
                    liveMusic = document.createElement('audio');
                    liveMusic.id = 'bgMusic';
                    liveMusic.loop = true;
                    liveMusic.preload = 'auto';
                    document.body.appendChild(liveMusic);
                }
                liveMusic.src = data.music_url;
                liveMusic.load();
            }
        });

        // Start ground and trees paused
        document.querySelector('.ground-line div').style.animationPlayState = 'paused';
        document.querySelector('.tree').style.animationPlayState = 'paused';

        document.getElementById('start-btn').addEventListener('click', function() {
            // Play music
            var music = document.getElementById('bgMusic');
            if(music) { music.play(); }

            // Hide overlay
            document.getElementById('start-overlay').classList.add('hide');

            // Start animation
            document.querySelector('.ground-line div').style.animationPlayState = 'running';
            document.querySelector('.tree').style.animationPlayState = 'running';
            
            // Assign drive-in and bounce animation to the bus
            document.querySelector('.vehicle-body').style.animation = 'driveIn 2s ease-out forwards, bounceInPlace 2s infinite linear 2s';

            // Show balloon after 5 seconds of driving
            setTimeout(function() {
                document.getElementById('balloon-container').classList.add('float-down');
            }, 5000);
        });

        // Click balloon to open letter
        document.getElementById('balloon-container').addEventListener('click', function() {
            document.getElementById('letter-modal').classList.add('show');
        });

        document.getElementById('close-letter-btn').addEventListener('click', function() {
            document.getElementById('letter-modal').classList.remove('show');
        });
    </script>
<script src="../js/security.js?v=1790434588" defer></script>
</body>

</html>
