  }
  const disk = new THREE.Mesh(new THREE.CircleGeometry(27, 48), new THREE.MeshBasicMaterial({ color: 9123337 }));
  disk.position.z = 3;
  flower.add(disk);
  flower.add(pointCloud(mobile ? 850 : 1500, () => {

  }, 16768817, 1.45, 0.88));
  flower.scale.setScalar(1e-3);
  const orbitGroup = new THREE.Group();
  scene.add(orbitGroup);
  const photoSprites = [];
  const phraseSprites = [];
  let mediaGeneration = 0;
  function circleTexture(url, index) {
    return new Promise((resolve) => {
      const c = document.createElement("canvas");
      c.width = c.height = 384;
      const g = c.getContext("2d");
      const finish = (img2) => {
        g.clearRect(0, 0, 384, 384);

        g.clip();

          grd.addColorStop(0, "#ffe66b");
          grd.addColorStop(1, "#5b3504");
          g.fillStyle = grd;

    }
  }
  function animate(now) {
    requestAnimationFrame(animate);
    updateTimeline(now);
    spiral.rotation.y -= 28e-4;
    core.rotation.y += 42e-4;
    flower.rotation.z = Math.sin(now * 45e-5) * 0.035;
    flower.position.y = 26 + Math.sin(now * 14e-4) * 4;
    photoSprites.forEach((sp) => {
      sp.userData.angle += sp.userData.speed;
      sp.position.set(Math.cos(sp.userData.angle) * sp.userData.radius, sp.userData.height, Math.sin(sp.userData.angle) * sp.userData.radius);
      sp.material.opacity = finalShown ? 0.28 : 0.96;
    });
    phraseSprites.forEach((sp) => {
      sp.userData.angle -= sp.userData.speed;
      sp.position.set(Math.cos(sp.userData.angle) * sp.userData.radius, sp.userData.height, Math.sin(sp.userData.angle) * sp.userData.radius);
      sp.material.opacity = finalShown ? 0.18 : 0.82;
    });
    targetRotX = Math.max(-0.45, Math.min(0.65, targetRotX));
    rotX += (targetRotX - rotX) * 0.06;
    rotY += (targetRotY - rotY) * 0.06;
    cameraDistance += (targetDistance - cameraDistance) * 0.06;
    camera.position.set(Math.sin(rotY) * cameraDistance, 90 + Math.sin(rotX) * 170, Math.cos(rotY) * cameraDistance);
    camera.lookAt(0, -8, 0);
    renderer.render(scene, camera);
  }
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", (e) => {
    dragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    targetRotY -= (e.clientX - lastX) * 6e-3;
    targetRotX += (e.clientY - lastY) * 4e-3;
    lastX = e.clientX;
    lastY = e.clientY;
  });
  canvas.addEventListener("pointerup", () => dragging = false);
  canvas.addEventListener("pointercancel", () => dragging = false);
  addEventListener("wheel", (e) => {
    targetDistance = Math.max(230, Math.min(760, targetDistance + e.deltaY * 0.2));
  }, { passive: true });
  document.getElementById("start").addEventListener("click", startExperience);
  document.getElementById("restart").addEventListener("click", startExperience);
  document.getElementById("continue").addEventListener("click", () => {
    startAt = performance.now() - 1800;
    setPhase("orbit");
  });
  document.getElementById("sound").addEventListener("click", async () => {
    if (!music.src) return;
    try {
      if (music.paused) {
        await music.play();
        document.getElementById("sound").textContent = "♫";
      } else {
        music.pause();
        document.getElementById("sound").textContent = "♪";
      }
    } catch (e) {
      document.getElementById("sound").textContent = "!";
    }
  });
  addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
  addEventListener("message", (event) => {
    if (event.origin !== location.origin || event.source !== parent || !event.data) return;
    if (event.data.type !== "DG_LIVE_PREVIEW_UPDATE" && event.data.type !== "LIVE_PREVIEW_UPDATE") return;
    const p = event.data.payload || event.data.data || {};
    if (Object.prototype.hasOwnProperty.call(p, "recipient_name")) data.recipient = p.recipient_name || "Ti";
    if (Object.prototype.hasOwnProperty.call(p, "sender_name")) data.sender = p.sender_name || "Con cariño";
    if (Object.prototype.hasOwnProperty.call(p, "message")) {
      data.message = p.message || "";
      const lines = String(p.message || "").split(/\r?\n/).map((v) => v.trim()).filter(Boolean);
      let phrases = lines;
      if (lines.length === 1 && lines[0].length > 40) {
        const parts = lines[0].split(/(?<=[.!?…])\s+/).map((v) => v.trim()).filter(Boolean);
        if (parts.length) phrases = parts;
      }
      data.phrases = phrases;
    }
    if (Array.isArray(p.photos)) data.photos = p.photos;
    if (p.music_url) data.music = p.music_url;
    renderData();
  });
  renderData();
  requestAnimationFrame(animate);
  if (data.preview) {
    startExperience();
    startAt = performance.now() - 2200;
  }
  if (parent !== window) document.fonts.ready.then(() => parent.postMessage({ type: "DG_PREVIEW_READY" }, location.origin));
})();
</script>
