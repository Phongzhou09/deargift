    /* Shooting Stars */
    .shooting-stars {

        100% { opacity: 0; }

    @keyframes shooting-star-pos {

    .shooting-star {
        display: block;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #88eeff;

        box-shadow: 0 0 18px 6px rgba(136, 238, 255, 0.7);
        opacity: 0;
    }
    .shooting-star:after {
        content: '';
        display: block;

        left: 4px;
        border: 0 solid #88eeff;

        border-color: transparent transparent transparent rgba(136, 238, 255, 0.55);

<script>
    (function setupMusicToggle() {
        var DEFAULT_MUSIC = "https://cdn.shopify.com/s/files/1/0757/9700/4572/files/tiktok-music-1777126901910-8b8u1.mp3?v=1777126913";
        var audio = document.getElementById('bg-music');
        var btn = document.getElementById('musicToggle');
        var icon = btn.querySelector('i');
        var playing = false;
        var busy = false;

        audio.src = DEFAULT_MUSIC;

        function setIcon(on) {
            icon.classList.remove('fa-volume-high', 'fa-volume-xmark');
            icon.classList.add(on ? 'fa-volume-high' : 'fa-volume-xmark');
            btn.classList.toggle('playing', on);
        }
        function play() {
            if (busy) return;
            busy = true;
            var p = audio.play();
            if (p && p.then) {
                p.then(function() {
                    playing = true; setIcon(true); busy = false;
                }).catch(function() { busy = false; });
            } else {
                playing = true; setIcon(true); busy = false;
            }
        }
        function pause() {
            audio.pause();
            playing = false; setIcon(false);
        }

        btn.addEventListener('click', function(e) {
            e.stopPropagation();
            playing ? pause() : play();
        });

        var kickstarted = false;
        function kickstart(e) {
            if (kickstarted) return;
            if (e.target && e.target.closest && e.target.closest('#musicToggle')) return;
            kickstarted = true;
            window.removeEventListener('pointerdown', kickstart);
            window.removeEventListener('touchstart', kickstart);
            if (!playing) play();
        }
        window.addEventListener('pointerdown', kickstart);
        window.addEventListener('touchstart', kickstart);

        (window.__CONFIG_READY__ || Promise.resolve(null)).then(function(cfg) {
            if (!cfg || !cfg.music || cfg.music === audio.src) return;
            var wasPlaying = playing;
            if (wasPlaying) {
                audio.pause();
                playing = false;
                setIcon(false);
            }
            audio.src = cfg.music;
            busy = false;
            if (wasPlaying) play();
        }).catch(function() { });

        play();

        window.backgroundMusicAPI = {
            play: play, pause: pause, isPlaying: function() { return playing; }
        };
    })();
</script>

    let gu = { time: { value: 0 } };

        pts.push(new THREE.Vector3().setFromCylindricalCoords(radius, Math.random() * 2 * Math.PI, (Math.random() - 0.5) * 2));
        sizes.push(Math.random() * 1.5 + 0.5);
        pushShift();
        partType.push(1);

    let g = new THREE.BufferGeometry().setFromPoints(pts);
    g.setAttribute("sizes", new THREE.Float32BufferAttribute(sizes, 1));
    g.setAttribute("shift", new THREE.Float32BufferAttribute(shift, 4));
    g.setAttribute("partType", new THREE.Float32BufferAttribute(partType, 1));
    let m = new THREE.PointsMaterial({
        size: 0.12,
        transparent: true,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        onBeforeCompile: shader => {
            shader.uniforms.time = gu.time;
            shader.vertexShader = `
                uniform float time;

            `.replace(
                `gl_PointSize = size;`,

            ).replace(
                `#include <color_vertex>`,
                `#include <color_vertex>
                if (partType > 1.5) {

                    `#include <begin_vertex>
                float t = time;
                float moveT = mod(shift.x + shift.z * t, PI2);

            shader.fragmentShader = `
            varying vec3 vColor;
            ${shader.fragmentShader}
            `.replace(
                `#include <clipping_planes_fragment>`,
                `#include <clipping_planes_fragment>
                float d = length(gl_PointCoord.xy - 0.5);
                if (d > 0.5) discard;
            `).replace(
                    `vec4 diffuseColor = vec4( diffuse, opacity );`,
                    `vec4 diffuseColor = vec4( vColor, smoothstep(0.5, 0.1, d) );`
                );
        }
    });
    let p = new THREE.Points(g, m);
    p.rotation.order = "ZYX";
    scene.add(p);

    // === Bầu trời sao nền ===
    const STAR_COUNT = 20000;
    const starPositions = new Float32Array(STAR_COUNT * 3);
    for (let i = 0; i < STAR_COUNT; i++) {
        starPositions[i * 3]     = (Math.random() - 0.5) * 900;
        starPositions[i * 3 + 1] = (Math.random() - 0.5) * 900;
        starPositions[i * 3 + 2] = (Math.random() - 0.5) * 900;
    }
    const starGeo = new THREE.BufferGeometry();
    starGeo.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
    const starMat = new THREE.PointsMaterial({
        color: 0xff5a5a,
        size: 0.7,
        transparent: true,
        opacity: 0.7,
        depthWrite: false,
        fog: false,
    });
    const stars = new THREE.Points(starGeo, starMat);
    stars.name = 'starfield';
    stars.renderOrder = 999;
    scene.add(stars);

    // === Trái tim hạt ===
    function makeMat({
        map = null,
        color = 0xffffff,
        transparent = true,
        vertexColors = true,
        sizeAttenuation = true,
        alphaSupport = false,
        clipBandWidth = 0,
        vClipSlope = 0,
        clipFrontZ = 0.1,
        blending = THREE.NormalBlending,
        opacity = 1,
        depthWrite = true,
    } = {}) {
        const material = new THREE.PointsMaterial({
            map, color, transparent, vertexColors, sizeAttenuation,
            blending, opacity, depthWrite,
        });
        material.onBeforeCompile = (shader) => {
            shader.vertexShader = shader.vertexShader.replace(
                "uniform float size;",
                "attribute float size;" +
                (alphaSupport ? "\nattribute float alpha;\nvarying float vAlpha;" : "") +
                (clipBandWidth > 0 || vClipSlope > 0 ? "\nvarying vec3 vViewPos;" : "")
            );
            let vertexShaderAddition = "";
            if (clipBandWidth > 0 || vClipSlope > 0) vertexShaderAddition += "  vViewPos = mvPosition.xyz;\n";
            if (alphaSupport) vertexShaderAddition += "  vAlpha = alpha;\n";
            if (vertexShaderAddition) {
                shader.vertexShader = shader.vertexShader.replace(
                    "#include <project_vertex>",
                    "#include <project_vertex>\n" + vertexShaderAddition
                );
            }
            if (alphaSupport) {
                shader.fragmentShader = shader.fragmentShader
                    .replace("void main() {", "varying float vAlpha;\nvoid main() {")
                    .replace(
                        "gl_FragColor = vec4( outgoingLight, diffuseColor.a );",
                        "gl_FragColor = vec4( outgoingLight, diffuseColor.a * vAlpha );"
                    );
            }
            if (clipBandWidth > 0 || vClipSlope > 0) {
                shader.fragmentShader = shader.fragmentShader.replace(
                    "void main() {",
                    "varying vec3 vViewPos;\nvoid main() {"
                );
                let clippingCode = "";
                if (clipBandWidth > 0) {
                    clippingCode += "\n  if (vViewPos.z < -" + clipBandWidth.toFixed(3) +
                        " && abs(vViewPos.x) < " + clipFrontZ.toFixed(3) + ") discard;";
                }
                if (vClipSlope > 0) {
                    clippingCode += "if (abs(vViewPos.x) < " + clipFrontZ.toFixed(3) +
                        " && vViewPos.z < -" + vClipSlope.toFixed(3) + " * (-vViewPos.z)) discard;";
                }
                const insertionPoint = alphaSupport
                    ? "gl_FragColor = vec4( outgoingLight, diffuseColor.a * vAlpha );"
                    : "gl_FragColor = vec4( outgoingLight, diffuseColor.a );";
                if (clippingCode) {
                    shader.fragmentShader = shader.fragmentShader.replace(
                        insertionPoint, clippingCode + "\n  " + insertionPoint
                    );
                }
            }
        };
        return material;
    }

    function generateGlowCircleTexture() {
        const e = document.createElement("canvas");
        e.width = 256; e.height = 256;
        const o = e.getContext("2d");
        const s = o.createRadialGradient(128, 128, 50.8, 128, 128, 127);

        s.addColorStop(1, "rgba(255,255,255,0)");
        o.fillStyle = s;
        o.beginPath(); o.arc(128, 128, 127, 0, 2 * Math.PI); o.closePath(); o.fill();

        r.addColorStop(0, "rgba(255,255,255,1)");
        r.addColorStop(1, "rgba(255,255,255,0)");
        o.fillStyle = r;
        o.beginPath(); o.arc(128, 128, 76.2, 0, 2 * Math.PI); o.closePath(); o.fill();
        const n = new THREE.CanvasTexture(e);
        n.minFilter = THREE.LinearFilter;
        n.magFilter = THREE.LinearFilter;

    }

    heartShape.bezierCurveTo(5, 2, 4, 0, 0, 0);

    heartShape.bezierCurveTo(-6, 11, -3, 15.4, 5, 19);
    heartShape.bezierCurveTo(12, 15.4, 16, 11, 16, 7);
    heartShape.bezierCurveTo(16, 7, 16, 0, 10, 0);
    heartShape.bezierCurveTo(7, 0, 5, 2, 5, 2);
    const polyPts = heartShape.getPoints(100);

    function isPointInsidePolygon(t, e) {
        let o = false;
        let a = 0;
        for (let s = e.length - 1; a < e.length; s = a++) {
            const r = e[a].x, n = e[a].y, i = e[s].x, c = e[s].y;
            if (n > t.y != c > t.y && t.x < ((i - r) * (t.y - n)) / (c - n) + r) o = !o;
        }
        return o;
    }
    const polyShift = polyPts.map((t) => ({ x: t.x - 5, y: t.y - 7 }));
    const BORDER_THRESHOLD = 0.1 * (Math.max(...polyPts.map((t) => t.x)) - Math.min(...polyPts.map((t) => t.x)));
    function calculateMinimumDistanceToBorder(t, e) {
        let a = Infinity;
        for (let s = 0; s < polyShift.length; s++) {
            const r = polyShift[s];
            const n = polyShift[(s + 1) % polyShift.length];
            const i = n.x - r.x, c = n.y - r.y;
            const l = ((t - r.x) * i + (e - r.y) * c) / (i * i + c * c);
            const x = Math.max(0, Math.min(1, l));
            const mm = (t - (r.x + x * i)) ** 2 + (e - (r.y + x * c)) ** 2;
            if (mm < a) a = mm;
        }
        return Math.sqrt(a);
    }

    const hPositions = [];
    const hxs = polyPts.map((t) => t.x);
    const hys = polyPts.map((t) => t.y);
    const minX = Math.min(...hxs), maxX = Math.max(...hxs);
    const minY = Math.min(...hys), maxY = Math.max(...hys);
    const threshold = minY + (maxY - minY) / 6;
    while (hPositions.length / 3 < 25000) {
        const t = Math.random() * (maxX - minX) + minX;
        const e = Math.random() * (maxY - minY) + minY;
        if (isPointInsidePolygon({ x: t, y: e }, polyPts)) {
            let o = Infinity;
            for (let a = 0; a < polyPts.length; a++) {
                const s = polyPts[a];
                const r = polyPts[(a + 1) % polyPts.length];
                const n = r.x - s.x, i = r.y - s.y;
                const c = ((t - s.x) * n + (e - s.y) * i) / (n * n + i * i);
                const l = Math.max(0, Math.min(1, c));
                const x = t - (s.x + l * n);
                const mm = e - (s.y + l * i);
                const _ = x * x + mm * mm;
                if (_ < o) o = _;
            }
            const a = 1 / (1 + 2 * Math.sqrt(o));
            if (Math.random() < a) {
                const o = 3.6 * (Math.random() - 0.5);
                hPositions.push(t - 5, e - 7, o);
            }
        }
    }

    const heartWidth = maxX - minX;
    const INDENT_Y = maxY - 0.25 * (maxY - minY);
    const INDENT_HALF_WIDTH = 0.35 * heartWidth;

    const HEART_SCALE = innerWidth < 768 ? 0.4 : 0.55;
    const hStaticSizes = new Float32Array(hPositions.length / 3);
    for (let t = 0; t < hStaticSizes.length; t++) hStaticSizes[t] = HEART_SCALE * 0.8 * (0.3 * Math.random() + 0.2);

    const hTopIndices = [];
    for (let t = 0; t < hPositions.length; t += 3) {
        if (hPositions[t + 1] > threshold + 0.1 * (Math.random() - 0.5) * (maxY - minY)) hTopIndices.push(t / 3);
    }
    const hTopSet = new Set(hTopIndices);

    let hBottomPositions = [];
    const hBottomColors = [];
    const hBottomSizes = [];
    const hTopPositionsArr = [];
    const hTopColors = [];
    const hTopSizes = [];
    const hTopAlpha = [];
    for (let t = 0; t < hPositions.length; t += 3) {
        const o = t / 3;
        const a = hStaticSizes[o];
        const s = hPositions[t], r = hPositions[t + 1], n = hPositions[t + 2];
        if (hTopSet.has(o)) {
            hTopPositionsArr.push(s, r, n);
            hTopColors.push(heartInitialColor.r, heartInitialColor.g, heartInitialColor.b);
            hTopSizes.push(a);
            const isIndent = Math.abs(s) < INDENT_HALF_WIDTH && r > INDENT_Y;
            hTopAlpha.push(isIndent ? 0 : 1);
        } else {
            hBottomPositions.push(s, r, n);
            hBottomColors.push(heartInitialColor.r, heartInitialColor.g, heartInitialColor.b);
            hBottomSizes.push(a);
        }
    }

    const hStaticGeo = new THREE.BufferGeometry();
    hStaticGeo.setAttribute("position", new THREE.Float32BufferAttribute(hTopPositionsArr, 3));
    hStaticGeo.setAttribute("color", new THREE.Float32BufferAttribute(hTopColors, 3));
    hStaticGeo.setAttribute("size", new THREE.Float32BufferAttribute(hTopSizes, 1));
    hStaticGeo.setAttribute("alpha", new THREE.BufferAttribute(new Float32Array(hTopAlpha), 1));
    const hMatStatic = makeMat({ map: circleTexture, alphaSupport: true });
    hMatStatic.alphaTest = 0.5;
    const staticHeart = new THREE.Points(hStaticGeo, hMatStatic);
    staticHeart.rotation.z = Math.PI;

    const hRotPos = [], hRotColors = [], hRotSizes = [];
    const hStaticBotPos = [], hStaticBotColors = [], hStaticBotSizes = [];
    for (let t = 0; t < hBottomPositions.length; t += 3) {
        if (Math.random() < 0.2) {
            hRotPos.push(hBottomPositions[t], hBottomPositions[t + 1], hBottomPositions[t + 2]);
            hRotColors.push(heartInitialColor.r, heartInitialColor.g, heartInitialColor.b);
            hRotSizes.push(hBottomSizes[t / 3]);
        } else {
            hStaticBotPos.push(hBottomPositions[t], hBottomPositions[t + 1], hBottomPositions[t + 2]);
            hStaticBotColors.push(heartInitialColor.r, heartInitialColor.g, heartInitialColor.b);
            hStaticBotSizes.push(hBottomSizes[t / 3]);
        }
    }

    const hBottomGeo = new THREE.BufferGeometry();
    hBottomGeo.setAttribute("position", new THREE.Float32BufferAttribute(hRotPos, 3));
    hBottomGeo.setAttribute("color", new THREE.Float32BufferAttribute(hRotColors, 3));
    hBottomGeo.setAttribute("size", new THREE.Float32BufferAttribute(hRotSizes, 1));
    hBottomGeo.setAttribute("alpha", new THREE.BufferAttribute(new Float32Array(hRotPos.length / 3).fill(1), 1));
    const hMatBottom = makeMat({ map: circleTexture, alphaSupport: true, vClipSlope: 0.3, clipFrontZ: 0.3 });
    hMatBottom.alphaTest = 0.5;
    const bottomHeart = new THREE.Points(hBottomGeo, hMatBottom);
    bottomHeart.rotation.z = Math.PI;

    let staticBottomHeart = null;
    if (hStaticBotPos.length > 0) {
        const gbh = new THREE.BufferGeometry();
        gbh.setAttribute("position", new THREE.Float32BufferAttribute(hStaticBotPos, 3));
        gbh.setAttribute("color", new THREE.Float32BufferAttribute(hStaticBotColors, 3));
        gbh.setAttribute("size", new THREE.Float32BufferAttribute(hStaticBotSizes, 1));
        const matbh = makeMat({ map: circleTexture, alphaSupport: true });
        matbh.alphaTest = 0.5;
        gbh.setAttribute("alpha", new THREE.BufferAttribute(new Float32Array(hStaticBotPos.length / 3).fill(1), 1));
        staticBottomHeart = new THREE.Points(gbh, matbh);
        staticBottomHeart.rotation.z = Math.PI;
    }

    let staticTopHeart = null;
    {
        const tArr = [], eArr = [], oArr = [];
        for (let a = 0; a < hTopPositionsArr.length; a += 3) {
            const inside = calculateMinimumDistanceToBorder(
                hTopPositionsArr[a] + 5, hTopPositionsArr[a + 1] + 7
            ) < BORDER_THRESHOLD || Math.random() < 0.3;
            if (Math.random() < 0.5 && inside) {
                tArr.push(hTopPositionsArr[a], hTopPositionsArr[a + 1], hTopPositionsArr[a + 2]);
                eArr.push(heartInitialColor.r, heartInitialColor.g, heartInitialColor.b);
                oArr.push(hTopSizes[Math.floor(a / 3)]);
            }
        }
        if (tArr.length) {
            const gth = new THREE.BufferGeometry();
            gth.setAttribute("position", new THREE.Float32BufferAttribute(tArr, 3));
            gth.setAttribute("color", new THREE.Float32BufferAttribute(eArr, 3));
            gth.setAttribute("size", new THREE.Float32BufferAttribute(oArr, 1));
            gth.setAttribute("alpha", new THREE.BufferAttribute(new Float32Array(tArr.length / 3).fill(1), 1));
            const matth = makeMat({ map: circleTexture, alphaSupport: true });
            matth.alphaTest = 0.5;
            staticTopHeart = new THREE.Points(gth, matth);
            staticTopHeart.rotation.z = Math.PI;
        }
    }

    const heartGroup = new THREE.Group();
    heartGroup.add(staticHeart);
    heartGroup.add(bottomHeart);
    if (staticBottomHeart) heartGroup.add(staticBottomHeart);
    if (staticTopHeart) heartGroup.add(staticTopHeart);
    heartGroup.scale.setScalar(HEART_SCALE);
    const HEART_Y = 19;
    heartGroup.position.set(0, HEART_Y, 0);
    scene.add(heartGroup);

    // === 3D text sprites cạnh trái tim ===
    const TEXT_X = 16;
    const TITLE_Y = HEART_Y + 1.3;
    const MSG_Y   = HEART_Y - 1.4;

    function makeTextSprite(canvasW, canvasH, px) {
        const c = document.createElement('canvas');
        c.width = canvasW * px; c.height = canvasH * px;
        const ctx = c.getContext('2d');
        ctx.scale(px, px);
        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
        const mat = new THREE.SpriteMaterial({
            map: tex, transparent: true, depthTest: false, depthWrite: false
        });
        mat.toneMapped = false;
        return { sprite: new THREE.Sprite(mat), canvas: c, ctx, texture: tex, w: canvasW, h: canvasH };
    }

    function drawGlowText(ctx, text, x, y, font, color) {
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.font = font;
        ctx.shadowColor = 'rgba(255, 20, 147, 0.85)';
        ctx.shadowBlur = 28;
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        ctx.shadowColor = 'rgba(255, 105, 180, 0.85)';
        ctx.shadowBlur = 16;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 6;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
        ctx.fillText(text, x, y);
    }

    const TITLE_CW = 1024, TITLE_CH = 200;
    const titleObj = makeTextSprite(TITLE_CW, TITLE_CH, 2);
    const titleSpriteW = 13;
    titleObj.sprite.scale.set(titleSpriteW, titleSpriteW * TITLE_CH / TITLE_CW, 1);
    titleObj.sprite.position.set(TEXT_X, TITLE_Y, 0);
    titleObj.sprite.renderOrder = 1200;

    let MAIN_TITLE_TEXT = __APP_CONFIG__.title || 'Gửi Em 💘';
    function drawTitle() {
        const c = titleObj.ctx;
        c.clearRect(0, 0, TITLE_CW, TITLE_CH);
        drawGlowText(c, MAIN_TITLE_TEXT, 12, TITLE_CH / 2,
            '400 78px "Pacifico", "Great Vibes", cursive', '#ff4d8a');
        titleObj.texture.needsUpdate = true;
    }
    drawTitle();
    if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(drawTitle);
    }

    const MSG_CW = 1024, MSG_CH = 130;
    const msgObj = makeTextSprite(MSG_CW, MSG_CH, 2);
    const msgSpriteW = 13;
    msgObj.sprite.scale.set(msgSpriteW, msgSpriteW * MSG_CH / MSG_CW, 1);
    msgObj.sprite.position.set(TEXT_X, MSG_Y, 0);
    msgObj.sprite.renderOrder = 1200;

    let msgList = (Array.isArray(__APP_CONFIG__.messages) && __APP_CONFIG__.messages.length)
        ? __APP_CONFIG__.messages
        : [
            "Gặp được em là điều may mắn nhất của anh 💖",
            "Cảm ơn em đã bước vào cuộc đời anh 🌹",
            "Anh yêu em nhiều lắm, mãi mãi bên em nhé 💞",
            "Mỗi ngày có em là một ngày hạnh phúc ✨"
        ];
    const MSG_FONT_BASE = 48;
    const msgFontAt = (px) => `italic 500 ${px}px "Mali", "Noto Sans", sans-serif`;
    let MSG_FONT = msgFontAt(MSG_FONT_BASE);
    (function fitMsgFont() {
        const probeCtx = msgObj.ctx;
        const padding = 12 + 12 + 4 + 3;
        let size = MSG_FONT_BASE;
        for (const s of msgList) {
            let cur = MSG_FONT_BASE;
            while (cur > 14) {
                probeCtx.font = msgFontAt(cur);
                if (probeCtx.measureText(s).width + padding <= MSG_CW) break;
                cur -= 1;
            }
            if (cur < size) size = cur;
        }
        MSG_FONT = msgFontAt(size);
    })();
    let msgIdx = 0, msgChar = 0, msgPhase = 'typing', msgPhaseT = 0;
    let cursorBlink = 0, cursorVis = true, msgLastTime = null;
    let lastDrawnIdx = -1, lastDrawnChar = -1, lastDrawnCursor = null;

    function updateMessageSprite(elapsed) {
        if (msgLastTime == null) { msgLastTime = elapsed; }
        const dt = Math.min(0.1, elapsed - msgLastTime);
        msgLastTime = elapsed;

        cursorBlink += dt;
        if (cursorBlink > 0.4) { cursorVis = !cursorVis; cursorBlink = 0; }
        msgPhaseT += dt;

        const full = msgList[msgIdx] || '';
        if (!full) return;

        if (msgPhase === 'typing' && msgPhaseT > 0.07) {
            msgPhaseT = 0; msgChar++;
            if (msgChar >= full.length) { msgChar = full.length; msgPhase = 'hold'; msgPhaseT = 0; }
        } else if (msgPhase === 'hold' && msgPhaseT > 1.8) {
            msgPhase = 'erasing'; msgPhaseT = 0;
        } else if (msgPhase === 'erasing' && msgPhaseT > 0.035) {
            msgPhaseT = 0; msgChar--;
            if (msgChar <= 0) { msgChar = 0; msgPhase = 'wait'; msgPhaseT = 0; }
        } else if (msgPhase === 'wait' && msgPhaseT > 0.4) {
            msgIdx = (msgIdx + 1) % msgList.length;
            msgPhase = 'typing'; msgPhaseT = 0;
        }

        if (msgIdx === lastDrawnIdx && msgChar === lastDrawnChar && cursorVis === lastDrawnCursor) return;
        lastDrawnIdx = msgIdx; lastDrawnChar = msgChar; lastDrawnCursor = cursorVis;

        const c = msgObj.ctx;
        c.clearRect(0, 0, MSG_CW, MSG_CH);
        const visText = full.substring(0, msgChar);
        drawGlowText(c, visText, 12, MSG_CH / 2, MSG_FONT, 'rgba(255, 255, 255, 0.96)');
        if (cursorVis) {
            c.save();
            c.font = MSG_FONT;
            c.textAlign = 'left';
            c.textBaseline = 'middle';
            const mm = c.measureText(visText);
            c.shadowColor = '#ff4d8a';
            c.shadowBlur = 12;
            c.fillStyle = '#ff4d8a';
            c.fillRect(12 + mm.width + 4, MSG_CH / 2 - 24, 3, 48);
            c.restore();
        }
        msgObj.texture.needsUpdate = true;
    }

    // === Reveal: hạt từ lõi cầu bay lên tụ thành tim ===
    const REVEAL_DURATION = 5.5;
    let revealStart = null;
    let revealDone = false;
    const revealData = heartGroup.children.map(h => {
        const posAttr = h.geometry.attributes.position;
        const target = new Float32Array(posAttr.array);
        const start = new Float32Array(target.length);
        const n = target.length / 3;
        for (let i = 0; i < n; i++) {
            const phi = Math.acos(2 * Math.random() - 1);
            const theta = Math.random() * 2 * Math.PI;
            const r = 9.5 + Math.random() * 0.5;
            const wx = r * Math.sin(phi) * Math.cos(theta);
            const wy = r * Math.cos(phi);
            const wz = r * Math.sin(phi) * Math.sin(theta);
            start[i * 3]     = -(wx / HEART_SCALE);
            start[i * 3 + 1] = -((wy - HEART_Y) / HEART_SCALE);
            start[i * 3 + 2] =  (wz / HEART_SCALE);
        }
        posAttr.array.set(start);
        posAttr.needsUpdate = true;
        return { posAttr, target, start };
    });

    let composer = null;
    if (!IS_MOBILE) {
        composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const afterimagePass = new AfterimagePass();
        afterimagePass.uniforms['damp'].value = 0.82;
        composer.addPass(afterimagePass);
    }

    // === Love letter plane mesh ===
    const letterMat = new THREE.MeshBasicMaterial({
        transparent: true,
        opacity: 0,
        depthTest: false,
        side: THREE.DoubleSide
    });
    const letterMesh = new THREE.Mesh(new THREE.PlaneGeometry(7, 5), letterMat);
    letterMesh.scale.setScalar(0);
    letterMesh.visible = false;
    letterMesh.renderOrder = 1100;
    letterMesh.position.copy(heartGroup.position);
    scene.add(letterMesh);

    new THREE.TextureLoader().load(TEMPLATE_BASE_URL + '/assets/envelop.png', (tex) => {
        letterMat.map = tex;
        letterMat.needsUpdate = true;
        const aspect = tex.image.width / tex.image.height;
        const LETTER_HEIGHT = 7;
        letterMesh.geometry.dispose();
        letterMesh.geometry = new THREE.PlaneGeometry(aspect * LETTER_HEIGHT, LETTER_HEIGHT);
    });

    // === Heart explosion ===
    const explosionEl = document.createElement('div');
    explosionEl.id = 'heart-explosion';
    document.body.appendChild(explosionEl);

    function createHeartExplosion() {
        const emojis = ['❤️','💖','💗','💕','💘','💝','✨','💫','🌟','🪷'];
        const count = 40;
        for (let i = 0; i < count; i++) {
            const pp = document.createElement('div');
            pp.className = 'explosion-particle';
            pp.textContent = emojis[i % emojis.length];
            const angle = (Math.PI * 2 / count) * i + (Math.random() - 0.5) * 0.5;
            const dist = 80 + Math.random() * 200;
            pp.style.fontSize = (16 + Math.random() * 24) + 'px';
            pp.style.setProperty('--tx', (Math.cos(angle) * dist) + 'px');
            pp.style.setProperty('--ty', (Math.sin(angle) * dist) + 'px');
            pp.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
            pp.style.setProperty('--end-scale', (Math.random() * 0.4 + 0.1));
            pp.style.setProperty('--duration', (0.6 + Math.random() * 0.8) + 's');
            explosionEl.appendChild(pp);
        }
        setTimeout(() => { explosionEl.innerHTML = ''; }, 2000);
    }

    // === Hit target vô hình bao quanh tim ===
    const HEART_HIT_RADIUS = innerWidth < 768 ? 9.5 : 8;
    const heartHitMesh = new THREE.Mesh(
        new THREE.SphereGeometry(HEART_HIT_RADIUS, 16, 16),
        new THREE.MeshBasicMaterial({ visible: false })
    );
    heartHitMesh.position.copy(heartGroup.position);
    heartHitMesh.position.y += 2.5 * HEART_SCALE;
    scene.add(heartHitMesh);

    let letterOpen = false;
    let letterProgress = 0;

    // === Love popup ===
    let LOVE_SENDER = __APP_CONFIG__.sender || '';
    let LOVE_TITLE   = __APP_CONFIG__.title || `Gửi Em ❤`;
    let LOVE_MESSAGE = __APP_CONFIG__.popupMessage || `Em à,\n\nCó những ngày anh không nói gì, nhưng trong tim anh chỉ toàn là em. Em là vì sao sáng nhất giữa cả thiên hà này, là lý do mỗi nhịp tim anh đập đều mang tên em.\n\nCảm ơn em đã xuất hiện, đã kiên nhẫn, đã dịu dàng với anh ngay cả những lúc anh vụng về nhất.\n\nYêu em — hôm nay, ngày mai, và cả những năm ánh sáng sau này. ❤`;

    const popupBackdrop = document.createElement('div');
    popupBackdrop.className = 'love-popup-backdrop';
    const firstImg = __APP_CONFIG__.popupImage || ((Array.isArray(__APP_CONFIG__.images) && __APP_CONFIG__.images.length) ? __APP_CONFIG__.images[0] : '');
    const resolvedImg = firstImg || (TEMPLATE_BASE_URL + '/assets/envelop.png');

    popupBackdrop.innerHTML = `
        <div class="love-popup">
            <button class="love-popup-close" type="button" aria-label="Đóng">✕</button>
            <h2 class="love-popup-title">${LOVE_TITLE}</h2>
            <div class="love-popup-body">
                <div class="love-popup-photo"><img src="${resolvedImg}" alt="love"></div>
                <div class="love-popup-content" style="flex:1; min-width:0; display:flex; flex-direction:column;">
                    <div class="love-popup-text"></div>
                    <div class="love-popup-signature" style="text-align:right; font-style:italic; margin-top:16px; font-weight:700; color:#e91e63; font-family:'Pacifico','Great Vibes',cursive; font-size:20px; ${LOVE_SENDER ? '' : 'display:none;'}">Người gửi: <span class="sig-name">${LOVE_SENDER}</span></div>
                </div>
            </div>
        </div>
    `;
    document.body.appendChild(popupBackdrop);

    const popupCloseBtn = popupBackdrop.querySelector('.love-popup-close');
    const popupTextEl   = popupBackdrop.querySelector('.love-popup-text');
    let typeTimer = null;

    function startTyping(text) {
        if (typeTimer) clearTimeout(typeTimer);
        popupTextEl.textContent = '';
        popupTextEl.classList.add('typing');
        let idx = 0;
        const step = () => {
            if (idx >= text.length) {
                popupTextEl.classList.remove('typing');
                return;
            }
            const ch = text[idx++];
            popupTextEl.textContent += ch;
            let delay = 45 + Math.random() * 45;
            if (ch === ' ') delay = 25;
            else if (ch === ',' || ch === ';') delay = 220;
            else if (ch === '.' || ch === '!' || ch === '?') delay = 340;
            else if (ch === '\n') delay = 300;
            typeTimer = setTimeout(step, delay);
        };
        step();
    }

    function showLovePopup() {
        popupBackdrop.classList.add('active');
        document.body.classList.add('love-popup-open');
        popupTextEl.textContent = '';
        startHeartRain();
        setTimeout(() => startTyping(LOVE_MESSAGE), 950);
    }

    function hideLovePopup() {
        popupBackdrop.classList.remove('active');
        document.body.classList.remove('love-popup-open');
        if (typeTimer) { clearTimeout(typeTimer); typeTimer = null; }
        popupTextEl.classList.remove('typing');
        stopHeartRain();
        if (letterState === 'open') {
            letterState = 'closing';
            letterOpen = false;
        }
    }

    popupCloseBtn.addEventListener('click', hideLovePopup);
    popupBackdrop.addEventListener('click', (e) => {
        if (e.target === popupBackdrop) hideLovePopup();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && popupBackdrop.classList.contains('active')) hideLovePopup();
    });

    // === Mưa tim ===
    const HEART_CHARS  = ['❤️', '💕', '💖', '💗', '💘', '💝', '💞', '🌹', '💐'];
    const SPARKLE_CHARS = ['✨', '🌟', '💫', '⭐'];
    const heartRainContainer = document.createElement('div');
    heartRainContainer.className = 'heart-rain';
    document.body.appendChild(heartRainContainer);
    let burstTimers = [];

    function spawnHeart(opts = {}) {
        const h = document.createElement('span');
        const isSparkle = Math.random() < 0.22;
        h.className = 'heart-drop' + (isSparkle ? ' sparkle' : '');
        const pool = isSparkle ? SPARKLE_CHARS : HEART_CHARS;
        h.textContent = pool[Math.floor(Math.random() * pool.length)];
        h.style.left = (Math.random() * 100) + 'vw';
        const sizeRand = Math.pow(Math.random(), 0.7);
        const size = 22 + sizeRand * 22;
        h.style.fontSize = size.toFixed(1) + 'px';
        const fallDur = 4.5 + Math.random() * 4;
        const swayAmp = 18 + Math.random() * 36;
        const rotMag = 30 + Math.pow(Math.random(), 1.5) * 240;
        const rotDir = Math.random() < 0.5 ? -1 : 1;
        h.style.setProperty('--fall-dur', fallDur + 's');
        h.style.setProperty('--sway-dur', (1.4 + Math.random() * 1.8) + 's');
        h.style.setProperty('--sway-delay', (-Math.random() * 2) + 's');
        h.style.setProperty('--sway-amp', swayAmp.toFixed(0) + 'px');
        h.style.setProperty('--rot-start', (-rotMag * rotDir).toFixed(0) + 'deg');
        h.style.setProperty('--rot-end',   ( rotMag * rotDir).toFixed(0) + 'deg');
        h.style.setProperty('--opacity', (0.85 + Math.random() * 0.15).toFixed(2));
        heartRainContainer.appendChild(h);
        setTimeout(() => h.remove(), fallDur * 1000 + 500);
    }

    function startHeartRain() {
        heartRainContainer.classList.add('active');
        burstTimers.forEach(t => clearTimeout(t));
        burstTimers = [];
        const total = innerWidth < 768 ? 18 : 28;
        const spread = 1600;
        for (let i = 0; i < total; i++) {
            const delay = (i / total) * spread + Math.random() * 100;
            burstTimers.push(setTimeout(spawnHeart, delay));
        }
    }

    function stopHeartRain() {
        burstTimers.forEach(t => clearTimeout(t));
        burstTimers = [];
        heartRainContainer.classList.remove('active');
    }

    // === Camera zoom state machine ===
    let letterState = 'closed';
    const CAM_ZOOM_DURATION = 3.5;
    let camAnimStart = 0;
    let camFromPos = new THREE.Vector3(), camToPos = new THREE.Vector3();
    let camFromTarget = new THREE.Vector3(), camToTarget = new THREE.Vector3();
    let camSavedPos = new THREE.Vector3(), camSavedTarget = new THREE.Vector3();

    // === Ảnh rải vào đĩa xoáy ===
    const photoFiles = (Array.isArray(__APP_CONFIG__.flyImages) && __APP_CONFIG__.flyImages.length)
        ? __APP_CONFIG__.flyImages
        : ((Array.isArray(__APP_CONFIG__.images) && __APP_CONFIG__.images.length)
            ? __APP_CONFIG__.images
            : []);
    const resolvePhotoSrc = (f) => { if (!f) return ""; if (/^(?:blob:|data:|https?:\/\/)/i.test(f)) return f; if (f.startsWith("../")) return f; if (f.startsWith("/")) return f; return f; };

    function createRoundedTexture(img, size = 256) {
        const canvas = document.createElement('canvas');
        canvas.width = canvas.height = size;
        const ctx = canvas.getContext('2d');
        const aspect = img.width / img.height;
        let dw, dh, ox, oy;
        if (aspect > 1) { dw = size; dh = size / aspect; ox = 0; oy = (size - dh) / 2; }
        else { dh = size; dw = size * aspect; ox = (size - dw) / 2; oy = 0; }
        const rr = size * 0.15;
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(ox + rr, oy);
        ctx.arcTo(ox + dw, oy, ox + dw, oy + rr, rr);
        ctx.arcTo(ox + dw, oy + dh, ox + dw - rr, oy + dh, rr);
        ctx.arcTo(ox, oy + dh, ox, oy + dh - rr, rr);
