    <script>
    (function () {
        var audio = document.getElementById('fw-audio');
        var start = document.getElementById('fw-start');
        var musicBtn = document.getElementById('fw-music');
        var ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
        var OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m17 9 5 6"/><path d="m22 9-5 6"/></svg>';
        function sync() { musicBtn.innerHTML = audio.muted || audio.paused ? OFF : ON; }
        audio.addEventListener('play', sync); audio.addEventListener('pause', sync); audio.addEventListener('volumechange', sync); sync();

        document.getElementById('fw-start-btn').addEventListener('click', function () {
            start.classList.add('is-hidden');
            window.NYFireworks.start();
        });
        musicBtn.addEventListener('click', function () {
            if (audio.paused) { audio.muted = false; audio.play().catch(function () {}); }
            else audio.muted = !audio.muted;
            sync();
        });
        document.getElementById('fw-full').addEventListener('click', function () {
            var el = document.documentElement;
            if (!document.fullscreenElement) { if (el.requestFullscreen) el.requestFullscreen().catch(function () {}); }
            else if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
        });
        // Ẩn tab thì tạm dừng nhạc, quay lại thì phát tiếp.
        var pausedByHidden = false;
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) { if (!audio.paused) { pausedByHidden = true; audio.pause(); } }
            else if (pausedByHidden) { pausedByHidden = false; audio.play().catch(function () {}); }
        });
    })();
    </script>
