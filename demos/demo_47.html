<script>
window.__XMAS_BASE = (window.location.pathname.indexOf('/demos/') !== -1) ? '../templates/christmas-gift' : 'templates/christmas-gift';
window.__XMAS_VER = "1792591470";
// Gắn ?v=version vào URL asset để luôn tải bản mới nhất.
window.__xv = function (u) {
    var v = window.__XMAS_VER;
    return v ? u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + v : u;
};
// Mẫu gốc là app 3 tầng của LoveGift: mỗi tầng nạp tầng sau bằng đường dẫn tương đối
// (gift/…, assets/…, final_gift/…). Trên LoveGift trang chạy ở /demo.php nên các path đó
// trỏ sai → 404. Hàm này viết lại mọi path tương đối trong HTML được nạp về gốc mẫu.
window.__xmasFix = function (html) {
    var b = window.__XMAS_BASE || '';
    return String(html).replace(
        /(src|href)=(["'])(?:\.\/)?((?:assets|gift|final_gift)\/)/g,
        '$1=$2' + b + '/$3'
    );
};
window.giftChristmasData = {"recipientName":"Người thương","musicType":"","musicFile":"","letter":{"greeting":"Gửi Người thương thân mến,","content":"Chạm để khám phá hiệu ứng của mẫu quà này.","signature":"DearGift"},"photos":[],"vipGift":{"type":"photos","images":[]}};
window.settings = {"countdown":10,"sequence":"MERRY|CHRISTMAS|2026","sequenceColor":"#ffffff","recipientName":"Người thương"};
window.addEventListener('message', function(event) {
    if (event.source !== window.parent || !event.data) return;
    var isDG = event.data.type === 'DG_LIVE_PREVIEW_UPDATE' || event.data.type === 'LIVE_PREVIEW_UPDATE';
    if (!isDG) return;
    var data = event.data.payload || event.data.data || {};
    var rName = data.recipient_name || 'Người thương';
    var photos = Array.isArray(data.photos) ? data.photos : [];
    window.giftChristmasData = window.giftChristmasData || {};
    window.giftChristmasData.recipientName = rName;
    window.giftChristmasData.photos = photos;
    window.giftChristmasData.vipGift = { type: 'photos', images: photos };
    var mgr = window.giftManager || window.giftOpenManager;
    if (mgr && typeof mgr.updateLetterContent === 'function') { try { mgr.updateLetterContent(); } catch(e) {} }
    if (photos.length > 0) {
        if (window.dataChristmasTree && window.dataChristmasTree.data) {
            window.dataChristmasTree.data.images = photos;
        }
        if (typeof window.__updateChristmasPhotos === 'function') {
            window.__updateChristmasPhotos(photos);
        }
    }
    if (data.music_url && !data.preserve_demo_audio) {
        window.giftChristmasData.musicFile = data.music_url;
        var audio = document.getElementById('christmasAudio') || document.querySelector('audio');
        if (audio && audio.src !== data.music_url) {
            audio.src = data.music_url;
            audio.load();
            audio.play().catch(function(){});
        }
    }
});
if (window.parent && window.parent !== window) {
    window.parent.postMessage({ type: 'DG_PREVIEW_READY' }, '*');
}
</script>
