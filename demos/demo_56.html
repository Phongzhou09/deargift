<script>
(function () {
    'use strict';
    var CFG = {"words":["3","2","1","GỬI Em","ANH YÊU EM ♥"],"accent":"#ff4d8d"};

    var root = document.getElementById('fwRoot');
    var cv = document.getElementById('fwCanvas');
    var ctx = cv.getContext('2d');
    var startEl = document.getElementById('fwStart');
    var card = document.getElementById('fwCard');
    var reopen = document.getElementById('fwReopen');

    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var MAX_PARTICLES = reduce ? 1400 : 3200;
    var GRAVITY = 0.045;
    var PALETTE = ['#ff4d8d', '#ffd166', '#7ae7ff', '#b388ff', '#ff7b54', '#ffffff', '#7dffb3', CFG.accent];

    var W = 0, H = 0, DPR = 1;
    function resize() {
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth; H = window.innerHeight;
        cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    resize();
    window.addEventListener('resize', resize);

    // Sao lấp lánh: vài chục chấm DOM, rẻ hơn vẽ lại mỗi khung hình.
    (function stars() {
        var box = document.getElementById('fwStars');
        var n = W < 600 ? 45 : 90;
        for (var i = 0; i < n; i++) {
            var s = document.createElement('i');
            s.style.left = (Math.random() * 100) + '%';
            s.style.top = (Math.random() * 75) + '%';
            s.style.animationDelay = (Math.random() * 3) + 's';
            if (Math.random() < 0.2) { s.style.width = s.style.height = '3px'; }
            box.appendChild(s);
        }
    })();

    var rockets = [];
    var parts = [];
    function pick() { return PALETTE[(Math.random() * PALETTE.length) | 0]; }
    function rand(a, b) { return a + Math.random() * (b - a); }

    /* ---------------- Các kiểu nổ ---------------- */

    function addPart(p) {
        if (parts.length >= MAX_PARTICLES) return;
        parts.push(p);
    }

    function burstPeony(x, y, color, count) {
        count = count || (reduce ? 60 : 110);
        var speed = rand(3.2, 5.2);
        var two = Math.random() < 0.35 ? pick() : null;
        for (var i = 0; i < count; i++) {
            var a = Math.random() * Math.PI * 2;
            var v = speed * (0.35 + Math.random() * 0.65);
            addPart({
                x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                life: rand(55, 85), max: 85, color: two && i % 2 ? two : color,
                size: rand(1.6, 2.6), drag: 0.975, g: GRAVITY, spark: Math.random() < 0.3
            });
        }
    }

    function burstRing(x, y, color) {
        var n = reduce ? 40 : 70, v = rand(3.4, 4.4);
        for (var i = 0; i < n; i++) {
            var a = (i / n) * Math.PI * 2;
            addPart({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                life: 70, max: 70, color: color, size: 2.2, drag: 0.97, g: GRAVITY * 0.6 });
        }
    }

    // Trái tim tham số: x = 16 sin³t, y = 13cos t − 5cos 2t − 2cos 3t − cos 4t
    function burstHeart(x, y, color, scale) {
        var n = reduce ? 70 : 130;
        scale = scale || Math.min(W, H) / 1400 + 0.12;
        for (var i = 0; i < n; i++) {
            var t = (i / n) * Math.PI * 2;
            var hx = 16 * Math.pow(Math.sin(t), 3);
            var hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            addPart({ x: x, y: y, vx: hx * scale, vy: hy * scale,
                life: 90, max: 90, color: color, size: 2.4, drag: 0.955, g: GRAVITY * 0.35 });
        }
        burstPeony(x, y, '#ffffff', reduce ? 14 : 26);
    }

    /* ---------------- Chữ pháo hoa ---------------- */

    var FONT = '"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif';

    // Lấy mẫu điểm ảnh của chữ. Chữ dài trên màn dọc thì tự xuống 2 dòng cho khỏi bé tí.
    function textPoints(str) {
        var off = document.createElement('canvas');
        var o = off.getContext('2d');
        var maxW = W * 0.88, maxH = H * 0.24;
        o.font = '900 100px ' + FONT;
        var lines = [str];
        var widest = o.measureText(str).width;
        var size = Math.min(maxH, 100 * maxW / widest);
        if (size < H * 0.085 && str.indexOf(' ') > 0) {
            var ws = str.split(' '), best = null;
            for (var k = 1; k < ws.length; k++) {
                var a = ws.slice(0, k).join(' '), b = ws.slice(k).join(' ');
                var m = Math.max(o.measureText(a).width, o.measureText(b).width);
                if (!best || m < best.m) best = { a: a, b: b, m: m };
            }
            lines = [best.a, best.b];
            widest = best.m;
            size = Math.min(maxH / 2.2, 100 * maxW / widest);
        }
        size = Math.max(size, 22);
        var lh = size * 1.15;
        off.width = Math.ceil(W);
        off.height = Math.ceil(lh * lines.length + size * 0.5);
        o.font = '900 ' + size + 'px ' + FONT;
        o.textAlign = 'center';
        o.textBaseline = 'middle';
        o.fillStyle = '#fff';
        lines.forEach(function (ln, i) {
            o.fillText(ln, off.width / 2, lh * (i + 0.5) + size * 0.25);
        });
        var img = o.getImageData(0, 0, off.width, off.height).data;
        var gap = Math.max(3, Math.round(size / 12));
        var cap = reduce ? 500 : 1100;
        var pts;
        do {
            pts = [];
            for (var y = 0; y < off.height; y += gap) {
                for (var x = 0; x < off.width; x += gap) {
                    if (img[(y * off.width + x) * 4 + 3] > 128) {
                        pts.push([x - off.width / 2, y - off.height / 2]);
                    }
                }
            }
            gap++;
        } while (pts.length > cap);
        return pts;
    }

    // Các hạt đang tạo chữ, để thả rơi cùng lúc. onFormed được gọi một lần khi gần
    // hết hạt đã về chỗ — kịch bản chờ mốc này rồi mới tính giờ giữ chữ, nên máy chậm
    // (ít khung hình/giây) không bị thả chữ khi chưa kịp thành hình.
    var textGroup = null;

    function burstText(x, y, str, color) {
        var pts = textPoints(str);
        var group = [];
        for (var i = 0; i < pts.length; i++) {
            var a = Math.random() * Math.PI * 2, v = rand(1, 6);
            var p = {
                x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
                tx: x + pts[i][0], ty: y + pts[i][1], mode: 'text', age: 0,
                life: 999, max: 999, color: Math.random() < 0.12 ? '#ffffff' : color,
                size: rand(1.8, 2.6), drag: 0.96, g: 0
            };
            parts.push(p);   // chữ bỏ qua trần hạt: thiếu hạt là chữ khuyết, khó đọc
            group.push(p);
        }
        textGroup = group;
        return new Promise(function (resolve) { group.onFormed = resolve; });
    }

    function releaseText() {
        if (!textGroup) return;
        textGroup.forEach(function (p) {
            p.mode = null;
            p.vx = rand(-0.6, 0.6); p.vy = rand(-0.4, 0.8);
            p.g = GRAVITY * 0.7; p.drag = 0.985;
            p.life = rand(40, 75); p.max = 75;
        });
        textGroup = null;
    }

    /* ---------------- Tên lửa ---------------- */

    function launch(tx, ty, onBurst, color, frames) {
        var x0 = tx + rand(-W * 0.08, W * 0.08);
        var y0 = H + 10;
        frames = frames || rand(48, 62);
        rockets.push({
            x: x0, y: y0, tx: tx, ty: ty,
            vx: (tx - x0) / frames, vy: (ty - y0) / frames,
            color: color || pick(), onBurst: onBurst, trail: []
        });
    }

    function randomShow() {
        var x = rand(W * 0.12, W * 0.88), y = rand(H * 0.12, H * 0.45), c = pick();
        var r = Math.random();
        launch(x, y, function () {
            if (r < 0.2) burstHeart(x, y, c);
            else if (r < 0.4) burstRing(x, y, c);
            else burstPeony(x, y, c);
        }, c);
    }

    /* ---------------- Vòng lặp vẽ ---------------- */

    var lastTs = 0;
    function frame(ts) {
        // Hạt chữ bay về chỗ theo thời gian thật, không theo số khung hình.
        var dt = lastTs ? Math.min(ts - lastTs, 100) : 16.7;
        lastTs = ts;
        var pull = 1 - Math.pow(0.9, dt / 16.7);

        // Xoá dần thay vì xoá sạch → đuôi pháo mờ dần, canvas vẫn trong suốt.
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(0,0,0,0.24)';
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'lighter';

        for (var i = rockets.length - 1; i >= 0; i--) {
            var r = rockets[i];
            r.x += r.vx; r.y += r.vy;
            ctx.globalAlpha = 1;
            ctx.fillStyle = '#fff4d6';
            ctx.fillRect(r.x - 1.2, r.y - 1.2, 2.4, 2.4);
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = r.color;
            ctx.fillRect(r.x - 0.8 + rand(-1, 1), r.y + 4, 1.6, 1.6);
            if (r.y <= r.ty) {
                rockets.splice(i, 1);
                r.onBurst && r.onBurst();
            }
        }

        for (var j = parts.length - 1; j >= 0; j--) {
            var p = parts[j];
            if (p.mode === 'text') {
                p.age++;
                if (p.age < 14) {             // nổ bung ra trước
                    p.vx *= p.drag; p.vy *= p.drag;
                    p.x += p.vx; p.y += p.vy;
                } else {                      // rồi bay về đúng chỗ trong chữ
                    p.x += (p.tx - p.x) * pull;
                    p.y += (p.ty - p.y) * pull;
                }
                ctx.globalAlpha = p.age > 40 ? 0.75 + Math.random() * 0.25 : 0.9;
            } else {
                p.vx *= p.drag; p.vy = p.vy * p.drag + p.g;
                p.x += p.vx; p.y += p.vy;
                if (--p.life <= 0 || p.y > H + 20) { parts.splice(j, 1); continue; }
                var a = p.life / p.max;
                ctx.globalAlpha = p.spark ? a * (0.4 + Math.random() * 0.6) : a;
            }
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
        }
        ctx.globalAlpha = 1;

        if (textGroup && textGroup.onFormed) {
            var near = 0;
            for (var k = 0; k < textGroup.length; k++) {
                var q = textGroup[k];
                if (Math.abs(q.tx - q.x) + Math.abs(q.ty - q.y) < 3) near++;
            }
            if (near >= textGroup.length * 0.9) {
                var done = textGroup.onFormed;
                textGroup.onFormed = null;
                done();
            }
        }
        requestAnimationFrame(frame);
    }

    /* ---------------- Kịch bản ---------------- */

    var timers = [];
    function at(ms, fn) { timers.push(setTimeout(fn, ms)); }
    var ambient = null;

    function showCard() {
        card.classList.add('is-on');
        reopen.classList.remove('is-on');
    }
    function hideCard() {
        card.classList.remove('is-on');
        reopen.classList.add('is-on');
    }

    function wait(ms) { return new Promise(function (r) { at(ms, r); }); }
    // Phóng tên lửa và chờ tới lúc nó nổ (thời gian bay phụ thuộc tốc độ khung hình).
    function launchWait(x, y, color, frames) {
        return new Promise(function (r) { launch(x, y, r, color, frames); });
    }

    // Kịch bản chạy tuần tự: mỗi chữ chờ tên lửa nổ → chờ chữ tụ xong → giữ → thả rơi.
    // Chờ theo SỰ KIỆN thay vì hẹn giờ cứng, để máy chậm vẫn đọc được trọn từng chữ.
    async function run(fast) {
        var opening = fast ? 3 : 6;
        for (var i = 0; i < opening; i++) { randomShow(); await wait(450); }
        await wait(700);

        for (var w = 0; w < CFG.words.length; w++) {
            var word = CFG.words[w];
            var isCount = /^\d{1,2}$/.test(word);
            var cy = H * 0.36;
            await launchWait(W / 2, cy, CFG.accent, isCount ? 30 : 40);
            var formed = burstText(W / 2, cy, word, CFG.accent);
            await Promise.race([formed, wait(4500)]);   // chặn kẹt nếu vài hạt không về kịp
            await wait(isCount ? 700 : 2000);
            releaseText();
            await wait(isCount ? 250 : 600);
        }

        // Pháo hoa trái tim
        [[0.3, 0.3], [0.7, 0.28], [0.5, 0.2]].forEach(function (pos, k) {
            at(k * 700, function () {
                var x = W * pos[0], y = H * pos[1];
                launch(x, y, function () { burstHeart(x, y, k === 2 ? CFG.accent : pick()); }, CFG.accent);
            });
        });
        await wait(3400);

        showCard();
        ambient = setInterval(function () { if (!document.hidden) randomShow(); }, reduce ? 2600 : 1500);
    }

    var started = false;
    function start(fast) {
        if (started) return;
        started = true;
        startEl.classList.add('is-hidden');
        // Cú chạm này cũng bật nhạc (gift.js lắng nghe lần chạm đầu tiên trên trang).
        if (window.GiftMusic) window.GiftMusic.play();
        var go = function () { run(fast); };
        // Chờ font tải xong, nếu không chữ pháo hoa sẽ lấy mẫu từ font dự phòng.
        if (document.fonts && document.fonts.load) {
            document.fonts.load('900 60px "Be Vietnam Pro"').then(go, go);
        } else {
            go();
        }
    }

    startEl.addEventListener('click', function () { start(false); });
    startEl.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); start(false); }
    });

    // Chạm vào bầu trời (không phải lá thư/nút) → bắn pháo hoa tới đúng chỗ chạm.
    root.addEventListener('click', function (e) {
        if (!started) return;
        var x = e.clientX, y = Math.min(e.clientY, H * 0.7), c = pick();
        launch(x, y, function () { Math.random() < 0.4 ? burstHeart(x, y, c) : burstPeony(x, y, c); }, c);
    });
    root.style.pointerEvents = 'auto';

    document.getElementById('fwAgain').addEventListener('click', function () {
        [[0.25, 0.3], [0.5, 0.22], [0.75, 0.3]].forEach(function (pos, k) {
            at(k * 350, function () {
                var x = W * pos[0], y = H * pos[1], c = pick();
                launch(x, y, function () { burstHeart(x, y, c); }, c);
            });
        });
    });
    document.getElementById('fwHide').addEventListener('click', hideCard);
    reopen.addEventListener('click', showCard);

    requestAnimationFrame(frame);

    // #xem-nhanh: bỏ qua màn chạm (dùng khi chụp ảnh bìa mẫu tự động).
    if (location.hash === '#xem-nhanh') start(true);
})();
</script>
