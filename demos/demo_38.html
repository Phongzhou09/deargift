    <!-- love-rain.bundle.js = love-rain.js + three.js đóng gói bằng esbuild (target chrome61) để chạy cả trên Android/WebView cũ. Sửa love-rain.js xong nhớ đóng gói lại. -->
    <script src="love-rain.bundle.js?v=1790400300"></script>
    <script>
    (function () {
        var intro = document.getElementById('lr-intro');
        var audio = document.getElementById('lr-audio');
        var btn = document.getElementById('lr-music');
        var ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
        var OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="m17 9 5 6"/><path d="m22 9-5 6"/></svg>';
        function sync() { btn.innerHTML = audio.paused || audio.muted ? OFF : ON; }
        ['play', 'pause', 'volumechange'].forEach(function (e) { audio.addEventListener(e, sync); }); sync();

        var opened = false;
        function open() {
            if (opened) return;
            opened = true;
            if (audio.getAttribute('src')) audio.play().catch(function () {});
            intro.classList.add('is-hidden');
            // Chớp sáng → tắt về đen → nghỉ ngắn rồi cảnh 3D lao ra từ tâm (như bản mẫu).
            setTimeout(function () { window.__LR_WANT_START = true; if (window.LoveRain) window.LoveRain.start(); }, 560);
        }
        intro.addEventListener('click', open);
        btn.addEventListener('click', function () {
            if (audio.paused) { audio.muted = false; audio.play().catch(function () {}); } else audio.muted = !audio.muted;
            sync();
        });
        var pausedByHidden = false;
        document.addEventListener('visibilitychange', function () {
            if (document.hidden) { if (!audio.paused) { pausedByHidden = true; audio.pause(); } }
            else if (pausedByHidden) { pausedByHidden = false; audio.play().catch(function () {}); }
        });
    })();
    </script>
