    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Outfit:wght@400;600;700;800&family=Great+Vibes&display=swap');
        body { font-family: 'Outfit', sans-serif; background: radial-gradient(circle at 50% 30%, #0d1527 0%, #050813 70%, #02040a 100%); min-height: 100vh; overflow: hidden; color: #ffffff; }
        .font-script { font-family: 'Great Vibes', cursive; }
        .glass-box { background: rgba(13, 21, 39, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 182, 193, 0.2); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 30px rgba(255, 143, 171, 0.15) inset; }
        .firefly { position: absolute; width: 4px; height: 4px; background: #ffe3b3; border-radius: 50%; box-shadow: 0 0 10px #ffb3c6, 0 0 20px #ffb3c6; animation: fireflyFloat 10s infinite ease-in-out; pointer-events: none; }
        @keyframes fireflyFloat { 0% { transform: translateY(100vh) scale(0.3); opacity: 0; } 20% { opacity: 0.9; } 80% { opacity: 0.9; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }
        .stem-path { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: drawStem 3s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        .stem-delay-1 { animation-delay: 0.3s; }
        .stem-delay-2 { animation-delay: 0.7s; }
        .stem-delay-3 { animation-delay: 1.1s; }
        .stem-delay-4 { animation-delay: 1.5s; }
        @keyframes drawStem { to { stroke-dashoffset: 0; } }
        .leaf { transform: scale(0); transform-origin: bottom center; animation: unfurlLeaf 1.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .leaf-delay-1 { animation-delay: 1.8s; }
        .leaf-delay-2 { animation-delay: 2.2s; }
        .leaf-delay-3 { animation-delay: 2.6s; }
        @keyframes unfurlLeaf { to { transform: scale(1); } }
        .flower-head { transform: scale(0) rotate(-45deg); transform-origin: center center; animation: bloomFlower 2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .bloom-delay-1 { animation-delay: 2.5s; }
        .bloom-delay-2 { animation-delay: 3.1s; }
        .bloom-delay-3 { animation-delay: 3.6s; }
        .bloom-delay-4 { animation-delay: 4.0s; }
        @keyframes bloomFlower { 0% { transform: scale(0) rotate(-45deg); opacity: 0; } 60% { transform: scale(1.1) rotate(5deg); opacity: 1; } 100% { transform: scale(1) rotate(0deg); opacity: 1; } }
        .wind-sway { transform-origin: 300px 420px; animation: swayWind 7s infinite ease-in-out; }
        @keyframes swayWind { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.2deg) translateY(-2px); } }
        @keyframes spinSlow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spin-slow { animation: spinSlow 8s linear infinite; }

    <script>
    (function () {
        'use strict';

        const container = document.getElementById('ambientContainer');

        for (let i = 0; i < 24; i++) {
            const firefly = document.createElement('div');
            firefly.className = 'firefly';
            firefly.style.left = Math.random() * 100 + 'vw';
            firefly.style.animationDelay = (Math.random() * 8) + 's';
            firefly.style.animationDuration = (Math.random() * 6 + 6) + 's';
            container.appendChild(firefly);
        }

        for (let i = 0; i < 12; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.innerHTML = '♥';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 16 + 14) + 'px';
            heart.style.animationDelay = (Math.random() * 9) + 's';
            heart.style.animationDuration = (Math.random() * 7 + 7) + 's';
            container.appendChild(heart);
        }

        document.body.addEventListener('click', (e) => {
            for (let i = 0; i < 8; i++) {
                const burst = document.createElement('div');
                burst.className = 'absolute text-pink-400 font-bold pointer-events-none z-50';
                burst.innerHTML = '♥';
                burst.style.left = e.clientX + 'px';
                burst.style.top = e.clientY + 'px';
                burst.style.fontSize = (Math.random() * 18 + 14) + 'px';
                burst.style.transition = 'all 1s ease-out';
                document.body.appendChild(burst);

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 70 + 30;
                
                requestAnimationFrame(() => {
                    burst.style.transform = `translate(${Math.cos(angle) * dist}px, ${Math.sin(angle) * dist}px) scale(1.4)`;
                    burst.style.opacity = '0';
                });

                setTimeout(() => burst.remove(), 1000);
            }
        });

        /* ---------------- Nhạc ----------------
           Nút này chỉ điều khiển trình phát của KHUNG (window.GiftMusic), không tự
           mở thẻ <audio> riêng nữa.

           Bản cũ có <audio id="bgMusic"> lấy thẳng $d['music'], sinh ra bốn lỗi:
             - Khách chọn link YouTube thì thành <source src="yt:xxx"> — không phải
               URL, trang câm hoàn toàn. Mà ô nhập nhạc lại khuyên dán YouTube.
             - Khung cũng phát bản của nó, nên bài hát chạy hai luồng lệch nhau.
             - Bỏ qua gift_music_allowed(): quà Free nghe được nhạc của gói trả phí.
             - Bỏ qua giới hạn 30 giây với file khách tự tải lên.

           Nguồn sự thật là nút nhạc của khung, không phải một biến riêng ở đây —
           nếu không, bấm nút kia rồi bấm nút này sẽ lệch trạng thái. */
        const btnMusic    = document.getElementById('btnMusic');
        const musicStatus = document.getElementById('musicStatus');
        const musicDisc   = document.getElementById('musicDisc');
        const frameBtn    = document.getElementById('giftMusicBtn');

        if (btnMusic) {
            const paintMusic = function (on) {
                if (musicStatus) musicStatus.textContent = on ? 'Đang phát ♪' : 'Bật nhạc lãng mạn';
                if (musicDisc) musicDisc.classList.toggle('spin-slow', on);
            };

            btnMusic.addEventListener('click', function (e) {
                e.stopPropagation();
                if (!window.GiftMusic || !frameBtn) {
                    if (musicStatus) musicStatus.textContent = 'Chưa chọn nhạc nền';
                    return;
                }
                frameBtn.classList.contains('is-playing')
                    ? window.GiftMusic.pause()
                    : window.GiftMusic.play();
            });

            if (frameBtn && window.MutationObserver) {
                new MutationObserver(function () {
                    paintMusic(frameBtn.classList.contains('is-playing'));
                }).observe(frameBtn, { attributes: true, attributeFilter: ['class'] });
                paintMusic(frameBtn.classList.contains('is-playing'));
            } else {
                paintMusic(false);
            }
        }

    })();
