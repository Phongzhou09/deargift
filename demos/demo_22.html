<script>
    window.__XMAS_BASE = "/christmas-gift";
    window.__XMAS_VER = "1791559678";
    window.__xv = function(u) { return u + (u.indexOf('?') < 0 ? '?' : '&') + 'v=' + window.__XMAS_VER; };
    window.__xmasFix = function(html) {
        var b = window.__XMAS_BASE || '/christmas-gift';
        return String(html).replace(/(src|href)=(["'])(?:\.\/)?((?:assets|gift|final_gift)\/)/g, '$1=$2' + b + '/$3');
    };
    // Injected by gift.php
    window.giftChristmasData = {"id":"PV12566B","recipientName":"Người thương","musicType":"file","musicFile":"assets/musics/hoanhipgiangsinh.mp3","letter":{"greeting":"Gửi Người thương thân mến,","content":"Chạm để khám phá hiệu ứng của mẫu quà này.","signature":"DearGift"},"photos":[],"vipGift":{"type":"photos","images":[]}};
    window.giftAssetVersion = 1791559678;
    window.addEventListener('message', function(event) {
        if (event.source !== window.parent) return;
        if (!event.data) return;
        var isDG = event.data.type === 'DG_LIVE_PREVIEW_UPDATE' || event.data.type === 'LIVE_PREVIEW_UPDATE';
        if (!isDG) return;
        var data = event.data.payload || event.data.data || {};
        if (!data) return;
        
        var esc = function(s) {
            return String(s).replace(/[&<>"']/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
            });
        };
        var rName = esc(data.recipient_name || 'bạn');
        var sName = esc(data.sender_name || 'Người thân yêu');
        var msg = esc(data.message || '');
        var photos = Array.isArray(data.photos) ? data.photos : [];
        
        window.giftChristmasData = window.giftChristmasData || {};
        window.giftChristmasData.recipientName = rName;
        window.giftChristmasData.photos = photos;
        window.giftChristmasData.vipGift = { type: 'photos', images: photos };
        window.giftChristmasData.letter = {
            greeting: 'Gửi ' + rName + ' thân mến,',
            content: msg,
            signature: sName
        };
        
        if (photos.length > 0) {
            if (window.dataChristmasTree && window.dataChristmasTree.data) {
                window.dataChristmasTree.data.images = photos;
            }
            if (typeof window.__updateChristmasPhotos === 'function') {
                window.__updateChristmasPhotos(photos);
            }
        }
        
        if (data.music_url && !data.preserve_demo_audio) {
            window.giftChristmasData.musicFile = data.music_url;
            var audio = document.getElementById('christmasAudio') || document.getElementById('bg-music') || document.querySelector('audio');
            if (audio && audio.src !== data.music_url) {
                audio.src = data.music_url;
                audio.load();
                audio.play().catch(function(){});
            }
        }
        
        if (window.giftManager && typeof window.giftManager.updateLetterContent === 'function') {
            window.giftManager.updateLetterContent();
        }
    });
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'DG_PREVIEW_READY' }, window.location.origin);
    }
    window.settings = {
        countdown: 10,
        sequence: "MERRY|CHRISTMAS|2026",
        sequenceColor: "#ffffff",
        recipientName: "Người thương"
    };
</script>

<body>
    <!-- Start Overlay -->
    <div id="start-overlay" class="start-overlay">
        <div class="start-overlay-content">
            <img src="assets/images/santa_notify.png" alt="Santa" class="santa-notify-icon">

    </div>

    <!-- Orientation Lock Message (for mobile) -->
    <div id="orientation-lock" class="orientation-lock">
        <div class="orientation-message">
            <img src="assets/images/rotate.png" alt="Rotate" class="rotate-icon">

            <button type="button" class="btn-skip-orientation" onclick="window.__skipOrientationLock=true; if(typeof checkOrientation==='function')checkOrientation();" style="margin-top:14px; padding:10px 20px; background:#fff; color:#c41535; font-weight:700; border-radius:24px; border:none; cursor:pointer; font-size:14px; box-shadow:0 4px 15px rgba(0,0,0,0.3);">
                Tiếp tục xem dọc &rarr;
            </button>
        </div>
    </div>


    <!-- Background Video -->
    <video id="backgroundVideo" class="background-video" muted playsinline preload="auto" style="display: none;" oncontextmenu="return false;" controlslist="nodownload nofullscreen noremoteplayback">
        <source src="assets/images/intro.mp4" type="video/mp4">
    </video>

    <!-- Main Canvas for Text Animation -->
    <canvas class="canvas" style="display: none;"></canvas>


    <!-- Music Control -->
    <div id="musicControl" class="music-control" title="Play Music" style="display: none;">▶</div>
    <audio id="christmasAudio" loop preload="auto">
        <source src="assets/musics/hoanhipgiangsinh.mp3" type="audio/mpeg">
    </audio>

    <!-- Settings Script (define before index.js) -->
    <script>
        // Default settings - bạn có thể thay đổi các giá trị này
        // Giữ settings đã được gift.php inject (tên người nhận, sequence...), chỉ dùng mặc định khi chưa có
        const settings = Object.assign({
            countdown: 10,
            sequence: "Chúc mừng giáng sinh!|🎉🎂🎁|Merry Christmas!|#gift",
            sequenceColor: "#ffffff",
            recipientName: "bé yêu" // Tên người nhận quà
        }, window.settings || {});
        window.settings = settings;

    </script>

    <!-- Load GiftChristmas API helper -->
    <script type="module">
        import { getGiftIdFromUrl, getGiftChristmasById } from './api/gift-christmas.js';
        
        // Lưu functions vào window để dùng trong index.js
        window.getGiftIdFromUrl = getGiftIdFromUrl;
        window.getGiftChristmasById = getGiftChristmasById;
        
        // Fetch GiftChristmas data nếu có ID trong URL
        async function initGiftChristmas() {
            // Nếu data đã được inject sẵn (ví dụ từ gift.php)
            if (window.giftChristmasData) {
                setupBackgroundMusic(window.giftChristmasData);
                return;
            }

            const giftId = getGiftIdFromUrl();
            if (giftId) {
                try {
                    const giftData = await getGiftChristmasById(giftId);
                    
                    // Lưu vào window để dùng ở các trang khác
                    window.giftChristmasData = giftData;
                    
                    // Setup nhạc nền nếu có
                    setupBackgroundMusic(giftData);
                } catch (error) {
                    console.error('❌ Error loading GiftChristmas:', error);
                    // Vẫn tiếp tục với flow bình thường nếu không load được
                }
            }
        }
        
        // Setup nhạc nền từ đầu (phát từ intro video)
        function setupBackgroundMusic(giftData) {
            if (!giftData.musicType || !giftData.musicFile) {
                return;
            }
            
            const christmasAudio = document.getElementById('christmasAudio');
            if (!christmasAudio) {
                console.warn('⚠️ Audio element not found');
                return;
            }
            
            let musicUrl = '';
            
            if (giftData.musicType === 'sample') {
                // Nhạc mẫu từ assets/musics/
                musicUrl = `assets/musics/${giftData.musicFile}`;
            } else if (giftData.musicType === 'file') {
                // Nhạc upload từ URL
                musicUrl = giftData.musicFile;
            }
            
            if (musicUrl) {
                // Thay đổi source của audio element
                christmasAudio.innerHTML = `<source src="${musicUrl}" type="audio/mpeg">`;
                christmasAudio.load();
                
                // KHÔNG tự động phát nhạc - đợi click "Sẵn sàng"
                // Nhạc sẽ được phát khi click button "Sẵn sàng" trong readyOverlayBtn handler
                
                console.log('🎵 Background music setup:', musicUrl);
            }
        }
        
        // Gọi init khi DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initGiftChristmas);
        } else {
            initGiftChristmas();
        }
    </script>
